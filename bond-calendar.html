<style>
/* 债市日历：全部走站点 token（--sans / 13 号字 / air·asparagus·violet 体系） */
.cal-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:10px 18px}
.cal-bar .cal-lbl{font-size:var(--t-small);color:var(--muted);letter-spacing:.02em}
.cal-bar .seg{display:inline-flex;align-items:center;font-size:var(--t-small);
  padding:4px 14px;cursor:pointer;user-select:none}
.cal-bar .seg + .seg{margin-left:-1px}
.cal-bar #custom-range{display:none;align-items:center;gap:8px;margin-left:2px}
.cal-bar input[type=date]{font-family:var(--sans);font-size:var(--t-small);color:var(--ink);
  background:var(--paper-2);border:var(--hair) solid var(--rule);border-radius:0;padding:3px 8px}
.cal-bar .cal-to{font-size:var(--t-small);color:var(--faint)}
.cal-bar #range-hint{margin-left:auto;font-size:12px;color:var(--faint);
  font-variant-numeric:tabular-nums}

.cal-legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:2px 0 10px;
  font-size:12px;color:var(--muted);line-height:1.6;
  border-bottom:var(--hair) solid var(--rule);margin-bottom:10px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cal-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.cal-legend .i-omo{background:#75756A}
.cal-legend .i-bd{background:#5D4C68}
.cal-legend .i-iss{background:#A15A36}
.cal-legend .i-mat{background:#2C6F65}
.cal-legend .i-det{background:#C08A6E}
.cal-legend .i-net{background:#1E6B43}
.cal-legend .i-evt{background:#3B6E9E}

.cal-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 10px}
.cal-inner{min-width:1296px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.cal-hd,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 152px;
  border-top:1px solid var(--rule-strong);border-left:1px solid var(--rule-strong);
  font-size:var(--t-small);line-height:1.35;color:var(--ink-2)}
.cal-hd>div,.cal>div{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:3px 6px;min-height:23px;box-sizing:border-box}
.cal-hd>div{background:var(--paper-3);font-weight:600;font-size:12px;text-align:center;
  letter-spacing:.06em;color:var(--ink-2);padding:6px 0;border-bottom-color:var(--rule-strong)}
.cal-hd>div:last-child{color:var(--violet)}
.cal-dh{line-height:1.3}
.cal-dn{font-weight:600;font-size:var(--t-small);color:var(--ink)}
.cal-dn.mark{background:#E9C46A;color:#3A3628;border-radius:2px;padding:0 4px}
.cal-bdg{font-size:11px;line-height:16px;padding:0 5px;border-radius:2px;margin-left:4px;
  vertical-align:1px;letter-spacing:.02em;white-space:nowrap}
.cal-bdg.tax{background:var(--violet);color:#fff}
.cal-bdg.tag{background:var(--paper-2);color:var(--violet);border:var(--hair) solid var(--rule-strong)}
.cal-fire{font-size:11px;margin-left:3px}
.cal-mon{float:right;color:var(--faint);font-weight:400;font-size:12px;letter-spacing:.04em}
.cal-hol{background:#F3F1F6!important}
.cal-c{text-align:center;font-size:var(--t-small)}
.cal-tot{text-align:left;padding-left:8px;font-weight:600;background:#F7F9FA}
.cal-omo{color:var(--faint)}
.cal-bd{color:var(--violet)}
.cal-iss{color:#A15A36}
.cal-mat{color:#2C6F65}
.cal-evt{color:#3B6E9E}
.cal-det{color:#C08A6E;font-size:12px}
.cal-net{color:var(--sig-bear);font-weight:600}
.cal-net.neg{color:var(--sig-bull)}
.cal-empty{padding:56px 0;text-align:center;color:var(--muted);font-size:var(--t-small)}
</style>

function pDate(s){ var a = s.split('-'); return new Date(Date.UTC(+a[0], +a[1]-1, +a[2])); }
function fDate(d){ return d.toISOString().slice(0,10); }
function addD(d, n){ var x = new Date(d.getTime()); x.setUTCDate(x.getUTCDate()+n); return x; }
function monday(d){ return addD(d, -((d.getUTCDay()+6)%7)); }
function sunday(d){ return addD(d, (7-d.getUTCDay())%7); }
function lastDay(y, m){ return new Date(Date.UTC(y, m+1, 0)); }

// Excel ROUND 口径（-0.5 不进位那套不做，跟 Python _r 一致）
function rnd(x){ return x >= 0 ? Math.floor(x+0.5) : -Math.floor(-x+0.5); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var P_LO = pDate(P.lo), P_HI = pDate(P.hi), P_ASOF = pDate(P.asof);

// ---- 区间预设
function presetRange(name){
  if (name === 'week'){                     // 当周 ±3 周（与日报月历一致）
    var mon = monday(P_ASOF);
    return [addD(mon, -21), addD(mon, 27)];
  }
  if (name === 'month'){                    // 含 asof 的自然月
    return [new Date(Date.UTC(P_ASOF.getUTCFullYear(), P_ASOF.getUTCMonth(), 1)),
            lastDay(P_ASOF.getUTCFullYear(), P_ASOF.getUTCMonth())];
  }
  if (name === 'next3m'){                   // asof → 3 个月后月末
    var y = P_ASOF.getUTCFullYear(), m = P_ASOF.getUTCMonth()+3;
    return [P_ASOF, lastDay(y + Math.floor(m/12), m % 12)];
  }
  return [P_LO, P_HI];                      // 全部
}

var mode = 'week', custom = null;

function curRange(){
  var s, e;
  if (mode === 'custom' && custom){
    s = pDate(custom[0]); e = pDate(custom[1]);
    if (e < s){ var t = s; s = e; e = t; }
  } else {
    var r = presetRange(mode); s = r[0]; e = r[1];
  }
  if (s < P_LO) s = P_LO;
  if (e > P_HI) e = P_HI;
  if (e < P_LO || s > P_HI){ s = P_LO; e = P_HI; }
  s = monday(s); e = sunday(e);            // 补到整周，半周看着别扭
  if (s < P_LO) s = P_LO;
  if (e > P_HI) e = P_HI;
  return [s, e];
}

// ---- 周内排版：复刻日报 calendar.py 的 _layout
function layout(days){
  var cnt = {};
  days.forEach(function(d){
    if (!d) return;
    var c = {};
    (d.it||[]).forEach(function(it){ var k = CANON[it[0]]; c[k] = (c[k]||0)+1; });
    for (var k in c) cnt[k] = Math.max(cnt[k]||0, c[k]);
  });
  var kinds = [];
  CANON.forEach(function(k){
    for (var n = 0; n < (cnt[k]||0); n++) kinds.push(k);
  });

  // 每天的 item 按 类别序 → 期限降序 排，再逐类递增占行位
  var placed = days.map(function(d){
    if (!d) return [];
    var items = (d.it||[]).slice().sort(function(a,b){
      var ka = CANON_IDX[CANON[a[0]]], kb = CANON_IDX[CANON[b[0]]];
      if (ka !== kb) return ka - kb;
      return (b[3]||0) - (a[3]||0);
    });
    var used = {}, out = [];
    items.forEach(function(it){
      var k = CANON[it[0]], i = used[k]||0, off = -1, n = -1;
      for (var j = 0; j < kinds.length; j++){
        if (kinds[j] === k){ n++; if (n === i){ off = j+1; break; } }
      }
      used[k] = i+1;
      if (off > 0) out.push({off:off, it:it});
    });
    return out;
  });

  // 合计：按行求和（OMO 不进合计）
  var totals = {};
  kinds.forEach(function(k, i){
    var off = i+1;
    if (!TOT_IDX[CANON_IDX[k]]) return;
    var sum = 0, any = false;
    placed.forEach(function(list){
      list.forEach(function(p){
        if (p.off === off && p.it[2] !== null && p.it[2] !== undefined){
          sum += p.it[2]; any = true;
        }
      });
    });
    if (any) totals[off] = {t: (P.label[String(CANON_IDX[k])]||'') + rnd(sum) + '亿', neg: sum < 0};
  });
  return {kinds:kinds, placed:placed, totals:totals};
}

// ---- 描边：每周四边各一条 2px 内阴影（当前周紫、其余浅蓝灰）
function frame(k, top, bottom, color){
  var p = [];
  if (top) p.push('inset 0 2px 0 ' + color);
  if (bottom) p.push('inset 0 -2px 0 ' + color);
  if (k === 0) p.push('inset 2px 0 0 ' + color);
  if (k === NCOL-1) p.push('inset -2px 0 0 ' + color);
  return p.join(',');
}

function dateHtml(d){
  var s = '<span class="cal-dn' + (d.y ? ' mark' : '') + '">' + d.d + '</span>';
  (d.b||[]).forEach(function(b){
    if (b === '🔥') s += '<span class="cal-fire">🔥</span>';
    else s += '<span class="cal-bdg ' + (b.indexOf('缴税') >= 0 ? 'tax' : 'tag') + '">' + esc(b) + '</span>';
  });
  if (d.m) s += '<span class="cal-mon">' + esc(d.m) + '</span>';
  return s;
}

function weekHtml(days, first, cur){
  var L = layout(days), kinds = L.kinds, placed = L.placed, totals = L.totals;
  var n = kinds.length, color = cur ? '#5D4C68' : '#C6D6E5';
  var out = ['<div class="cal"' + (first ? '' : ' style="border-top:0"') + '>'];

  // 日期行（第 1 行）
  for (var k = 0; k < NCOL; k++){
    var st = ['grid-area:1/' + (k+1)];
    var sh = frame(k, true, n === 0, color);
    if (sh) st.push('box-shadow:' + sh);
    var cls = ['cal-dh'];
    if (k < 7 && days[k] && days[k].h) cls.push('cal-hol');
    out.push('<div class="' + cls.join(' ') + '" style="' + st.join(';') + '">' +
             (k < 7 && days[k] ? dateHtml(days[k]) : '') + '</div>');
  }

  // 内容行
  kinds.forEach(function(kind, i){
    var off = i+1, last = (i === n-1);
    var cls = 'cal-c cal-' + ROWCLS[CANON_IDX[kind]];
    for (var k = 0; k < 7; k++){
      var st = ['grid-area:' + (i+2) + '/' + (k+1)];
      var sh = frame(k, false, last, color);
      if (sh) st.push('box-shadow:' + sh);
      var c2 = cls, txt = '';
      if (days[k]){
        if (days[k].h) c2 += ' cal-hol';
        for (var q = 0; q < placed[k].length; q++){
          if (placed[k][q].off === off){
            var hit = placed[k][q].it;
            txt = hit[1];
            if (kind === 'net_pay' && hit[2] < 0) c2 += ' neg';
            break;
          }
        }
      }
      out.push('<div class="' + c2 + '" style="' + st.join(';') + '">' + esc(txt) + '</div>');
    }
    // 合计列
    var st2 = ['grid-area:' + (i+2) + '/' + NCOL];
    var sh2 = frame(NCOL-1, false, last, color);
    if (sh2) st2.push('box-shadow:' + sh2);
    var tt = totals[off];
    var tcls = cls + ' cal-tot' + (kind === 'net_pay' && tt && tt.neg ? ' neg' : '');
    out.push('<div class="' + tcls + '" style="' + st2.join(';') + '">' +
             esc(tt ? tt.t : '') + '</div>');
  });

  out.push('</div>');
  return out.join('');
}

// ---- 渲染
var bodyEl = document.getElementById('cal-body');
var hintEl = document.getElementById('range-hint');
var inpS = document.getElementById('range-start');
var inpE = document.getElementById('range-end');

function render(){
  var r = curRange(), lo = r[0], hi = r[1];
  var html = ['<div class="cal-hd">' +
              DOW.concat(['合计']).map(function(x){ return '<div>' + x + '</div>'; }).join('') +
              '</div>'];
  var d = lo, weeks = 0;
  while (d <= hi){
    var days = [];
    for (var k = 0; k < 7; k++){ var ds = fDate(addD(d, k)); days.push(P.days[ds] || null); }
    var ws = fDate(d), we = fDate(addD(d, 6));
    var cur = (ws <= P.asof && P.asof <= we);
    html.push(weekHtml(days, weeks === 0, cur));
    weeks++; d = addD(d, 7);
  }
  bodyEl.innerHTML = html.join('');
  hintEl.textContent = '显示 ' + fDate(lo) + ' ~ ' + fDate(hi) + '（共 ' + weeks + ' 周）';
  if (mode !== 'custom'){
    inpS.value = fDate(lo); inpE.value = fDate(hi);
  }
}

// ---- 交互
inpS.min = inpE.min = P.lo;
inpS.max = inpE.max = P.hi;

document.getElementById('range-seg').addEventListener('click', function(ev){
  var t = ev.target.closest('.seg');
  if (!t) return;
  var seg = this.querySelectorAll('.seg');
  for (var i = 0; i < seg.length; i++) seg[i].classList.remove('active');
  t.classList.add('active');
  mode = t.getAttribute('data-range');
  var box = document.getElementById('custom-range');
  if (mode === 'custom'){
    box.style.display = 'flex';
    custom = [inpS.value || P.lo, inpE.value || P.hi];
  } else {
    box.style.display = 'none';
  }
  render();
});

function onCustom(){
  if (!inpS.value || !inpE.value) return;
  custom = [inpS.value, inpE.value];
  mode = 'custom';
  render();
}
inpS.addEventListener('change', onCustom);
inpE.addEventListener('change', onCustom);

// ---- 头部文案与注释
document.getElementById('data-info').textContent =
  '数据截至 ' + P.asof +
  (P.tableWindow[0] ? '｜取数大表窗口 ' + P.tableWindow[0] + ' ~ ' + P.tableWindow[1] : '') +
  '｜可查 ' + P.lo + ' ~ ' + P.hi;
document.getElementById('cal-note').textContent = P.note + ' ' + P.srcNote;

if (!Object.keys(P.days).length){
  bodyEl.innerHTML = '<div class="cal-empty">窗口内没有日历数据。</div>';
} else {
  render();
}
})();
</script>
