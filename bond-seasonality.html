<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans)}
.container{max-width:var(--site-max);margin:0 auto;padding:14px var(--site-gutter) 4px}

/* 筛选：纸面直排，行间 0.5px 细线 */
.controls{background:none;border:0;border-radius:0;box-shadow:none;padding:0;margin:0}
.control-row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 0;margin:0;border-bottom:var(--hair) solid var(--rule)}
.control-row:last-child{border-bottom:0}
.control-label{font-family:var(--serif);font-weight:500;font-size:var(--t-small);color:var(--muted);min-width:56px;letter-spacing:.02em}
.control-label.is-inline{margin-left:12px;min-width:0}
.btn-group{display:flex;flex-wrap:wrap;gap:4px}
.btn{padding:2px 9px 3px;border:var(--hair) solid transparent;border-radius:0;background:none;cursor:pointer;font-family:var(--sans);font-size:var(--t-small);color:var(--ink-2);line-height:1.5}
.btn:hover{border-color:var(--rule);color:var(--ink)}
.btn.active{background:var(--violet);border-color:var(--violet);color:#fff}
select{padding:2px 6px;border:var(--hair) solid var(--rule);border-radius:0;background:var(--paper-2);color:var(--ink);font-family:var(--sans);font-size:var(--t-small);line-height:1.5}
select:focus{outline:none;border-color:var(--violet)}

/* 视图切换：文字页签 + 紫色下划线 */
.tab-bar{display:flex;gap:28px;margin:10px 0 0;border-bottom:var(--hair) solid var(--rule-strong);background:none;border-radius:0;padding:0}
.tab{padding:5px 0 9px;cursor:pointer;font-family:var(--sans);font-size:var(--t-body);line-height:1.4;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab-bar .tab.active{background:none;border-color:transparent;border-bottom-color:var(--violet);color:var(--ink);font-weight:600}
.panel{background:none;border:0;border-radius:0;box-shadow:none;padding:10px 0 0;margin:0}
#panel-events,#panel-heatmap,#panel-calendar{padding:10px 0 0;margin:0;border:0;box-shadow:none}
.chart-box{width:100%;height:320px}
#calendar-prob{border-top:var(--hair) solid var(--rule);margin-top:6px}
.chart-note{font-family:var(--serif);font-weight:500;font-size:var(--t-small);color:var(--muted);line-height:1.7;margin-top:6px}

/* 未来 5 日：纸面 3 号底 + 哥蓝细边 */
.upcoming{border:var(--hair) solid var(--rule-strong);background:var(--paper-3);margin-bottom:12px}
.upcoming-head{display:flex;justify-content:space-between;align-items:center;gap:8px 18px;flex-wrap:wrap;padding:9px 14px;border-bottom:var(--hair) solid var(--rule)}
.upcoming-title{font-family:var(--serif);font-size:var(--t-body);font-weight:600;color:var(--ink)}
.upcoming-ctrl{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-weight:500;font-size:var(--t-small);color:var(--muted)}
.mini-btn{font-size:var(--t-small);line-height:1.5;padding:2px 12px 3px;background:var(--violet);color:#fff;border:var(--hair) solid var(--violet);border-radius:0;cursor:pointer;font-family:var(--sans)}
.upcoming-body{max-height:330px;overflow-y:auto;font-size:var(--t-small);color:var(--ink)}
.judge-line{padding:7px 14px;font-family:var(--sans);font-size:var(--t-small);line-height:1.7;color:var(--ink-2);border-bottom:var(--hair) solid var(--rule);background:var(--paper-2)}

.up-tbl{width:100%;border-collapse:collapse;font-size:var(--t-small)}

.summary-box{padding:9px 0 7px;background:none;border:0;border-top:var(--hair) solid var(--rule);margin:0;font-family:var(--serif);font-weight:500;font-size:var(--t-small);color:var(--muted);line-height:1.7}

<script>

// ===== 数据展开（紧凑格式 v3，见 scripts/rebuild_html.py）=====
// 首屏只下发 core：统计量按交易日键压成定长数组，heatmap 单元格与事件表由它现算；
// 各年走势序列（yields/spreads）与 heatmap 的逐年数值放在 bond-seasonality-series.js，
// 首屏渲染后异步加载。逐年数值不单独下发：它等于「当日未来 10 个交易日变化」在
// 自然日上 ffill（见 applySeries），可由序列现算，与 compute_seasonality 逐格一致
// （rebuild_html.py 末尾有同算法的离线自检）。
(function(d){
  if(!d||d.v!==3||!d.stats)return;
  var M=d.mds, st=d.stats, out={};
  for(var s in st){
    var dst={};
    for(var i=0;i<M.length;i++){
      var e=st[s][i];
      if(e) dst[M[i]]={a:e[0],m:e[1],d:e[2],u:e[3],n:e[4],y:null};
    }
    out[s]=dst;
  }
  d.heatmap=out;
  // 事件表规则与 compute_seasonality.py 一致；排序用稳定排序，同概率时次序与原版相同
  var ev=[];
  for(var c in out) for(var k in out[c]){
    var t=out[c][k];
    if(t.n<5)continue;
    if(t.d>=0.70) ev.push({series:c,date:k,direction:'下行',probability:t.d,avg_change:t.a,median_change:t.m,n_years:t.n});
    else if(t.u>=0.70) ev.push({series:c,date:k,direction:'上行',probability:t.u,avg_change:t.a,median_change:t.m,n_years:t.n});
  }
  ev.sort(function(a,b){return b.probability-a.probability;});
  d.events=ev;
})(window.DATA);

// ECharts 延迟加载：页面在图表库到达前就可以交互，需要画图的动作先排队
var __ecQ=[];
function whenEcharts(fn){ if(window.echarts)fn(); else __ecQ.push(fn); }
function __flushEcharts(){ var q=__ecQ; __ecQ=[]; q.forEach(function(f){try{f();}catch(e){}}); }

var __seriesP=null;
function ensureSeries(){
  if(window.DATA_SERIES){ applySeries(); return Promise.resolve(); }
  if(!__seriesP){
    __seriesP=new Promise(function(res,rej){
      var sc=document.createElement('script');
      sc.src='bond-seasonality-series.js';
      sc.onload=function(){ try{applySeries();}catch(e){} res(); };
      sc.onerror=function(){ __seriesP=null; rej(new Error('series load failed')); };
      document.head.appendChild(sc);
    });
  }
  return __seriesP;
}

// 2 位小数、半向 +∞——与 Python round_half_up 同口径
function jsR2(x){return (x>=0?Math.floor(x*100+0.5):-Math.floor(-x*100+0.5))/100;}

function applySeries(){
  var S=window.DATA_SERIES, d=window.DATA;
  if(!S||S.v!==3||d.__seriesDone)return;
  d.__seriesDone=true;

  // 1) 并集交易日历（收益率与利差共用）
  var yrs=[];
  for(var yk in S.cal) yrs.push(+yk);
  yrs.sort(function(a,b){return a-b;});
  var tU=[], uIdx={};
  yrs.forEach(function(y){
    S.cal[String(y)].forEach(function(md){
      uIdx[y+'-'+md]=tU.length;
      tU.push(Date.UTC(y,+md.slice(0,2)-1,+md.slice(3)));
    });
  });

  // 2) 按年序列展开成 [mm-dd, 值] 数组（弹层走势图用）
  function expand(src){
    var out={};
    for(var col in src){
      out[col]={};
      for(var yr in src[col]){
        var arr=src[col][yr], cal=S.cal[yr];
        var pos={}; for(var j=0;j<cal.length;j++) pos[cal[j]]=j;
        var st=pos[arr[0]], pts=[];
        for(var i=1;i<arr.length;i++) pts.push([cal[st+i-1],arr[i]]);
        out[col][yr]=pts;
      }
    }
    return out;
  }
  d.yields_by_year=expand(S.yields_by_year);
  d.spreads_by_year=expand(S.spreads_by_year);

  // 3) heatmap 逐年数值 y：并集日历上 shift(-10) 得每日变化，再按自然日 ffill
  //    （等价于「该日未来 10 个交易日变化」；收益率 ×100 转 bp，利差本身是 bp）
  function colChanges(col,src,isYld){
    var rows=src[col], vals=new Float64Array(tU.length); vals.fill(NaN);
    for(var yr in rows){
      var arr=rows[yr], cal=S.cal[yr], st=cal.indexOf(arr[0]);
      for(var i=1;i<arr.length;i++) vals[uIdx[yr+'-'+cal[st+i-1]]]=arr[i];
    }
    var ct=[], cv=[], first=NaN, last=NaN;
    var i, v;
    for(i=0;i<tU.length;i++){v=vals[i];if(v===v){if(first!==first)first=tU[i];last=tU[i];}}
    for(i=0;i+10<tU.length;i++){
      var a=vals[i], b=vals[i+10];
      if(a!==a||b!==b)continue;
      ct.push(tU[i]); cv.push(isYld?(b-a)*100:(b-a));
    }
    return {t:ct,v:cv,first:first,last:last};
  }
  function at(ch,t){      // 最后一个变化日 ≤ t 的取值（ffill）
    var lo=0,hi=ch.t.length-1,r=-1;
    while(lo<=hi){var mid=(lo+hi)>>1;if(ch.t[mid]<=t){r=mid;lo=mid+1;}else hi=mid-1;}
    return r<0?null:ch.v[r];
  }
  Object.keys(d.heatmap).forEach(function(key){
    var base=key.replace(/_chg10$/,'');
    var isYld=!!S.yields_by_year[base];
    var src=isYld?S.yields_by_year[base]:S.spreads_by_year[base];
    if(!src)return;
    var ch=colChanges(base,isYld?S.yields_by_year:S.spreads_by_year,isYld);
    if(!ch.t.length)return;
    var grid=d.heatmap[key];
    for(var k=0;k<d.mds.length;k++){
      var md=d.mds[k], cell=grid[md];
      if(!cell)continue;
      var em=+md.slice(0,2), ed=+md.slice(3), yy={};
      for(var yi=0;yi<d.years.length;yi++){
        var y=d.years[yi], tt=Date.UTC(y,em-1,ed);
        var dt=new Date(tt);
        if(dt.getUTCMonth()!==em-1||dt.getUTCDate()!==ed)continue;   // 2-29 非闰年
        if(tt<ch.first||tt>ch.last)continue;
        var vv=at(ch,tt);
        if(vv!==null)yy[y]=jsR2(vv);
      }
      cell.y=yy;
    }
  });
}

function formatName(s){return s.replace(/_chg10/g,'').replace(/_/g,' ')}
function sgn(v,d){return (v>0?'+':'')+(v<0?'−'+Math.abs(v).toFixed(d):v.toFixed(d))}
function mdLabel(key){
    if(DATA.md_key_to_label && DATA.md_key_to_label[key]) return DATA.md_key_to_label[key];
    var parts=key.split('-');
    if(parts.length===2) return parseInt(parts[0])+'月'+parseInt(parts[1])+'日';
    return key;
}
function classifyEvent(s){
    if(s.includes('5-2')||s.includes('10-5')||s.includes('10-2')||s.includes('30-10'))return 'term';
    if(s.includes('国开-国债')||s.includes('中票-国开')||s.includes('中票-二债')||s.includes('二债-国开')||false)return 'variety';
    if(s.includes('AA-AAA'))return 'credit';
    return 'yield';
}

let curCat='all',curMonth=0,curProb=0.7,curDir='all',curSeriesFilter='all';
var curModal=null;   // 当前弹层目标：走势数据异步到达后，据此判断是否还要画

function filterEvents(){
    return DATA.events.filter(e=>{
        if(e.probability<curProb)return false;
        if(curMonth>0){
            var m=parseInt(e.date.split('-')[0]);
            if(m!==curMonth)return false;
        }
        if(curCat!=='all'&&classifyEvent(e.series)!==curCat)return false;
        if(curSeriesFilter!=='all'&&e.series!==curSeriesFilter)return false;
        if(curDir==='down'&&e.direction!=='下行')return false;
        if(curDir==='up'&&e.direction!=='上行')return false;
        return true;
    }).sort((a,b)=>b.probability-a.probability);
}
function updateSeriesDropdown(){
    var sel=document.getElementById('series-filter');
    var seriesSet=new Set();
    DATA.events.forEach(function(e){
        if(curCat==='all'||classifyEvent(e.series)===curCat) seriesSet.add(e.series);
    });
    var sorted=Array.from(seriesSet).sort();
    sel.innerHTML='<option value="all">品种/利差</option>';
    sorted.forEach(function(s){

    });
    if(curSeriesFilter!=='all'&&!seriesSet.has(curSeriesFilter)){curSeriesFilter='all';}
    sel.value=curSeriesFilter;
}

function judgeBullBear(series,direction){
    var nm=formatName(series);
    var s=series.replace(/_chg10/g,'');
    var up=(direction==='上行');
    var legA='',legB='';
    var mTerm=s.match(/^(\d+)-(\d+)(国债|国开)$/);
    var mVar=s.match(/^(.+?)-(.+?)(\d+Y)$/);
    if(mTerm){
        legA=mTerm[1]+'Y'+mTerm[3];
        legB=mTerm[2]+'Y'+mTerm[3];
        if(up)return{txt:'走扩(陡峭化)→看空'+legA+'/看多'+legB,cls:'b'};
        return{txt:'收窄(平坦化)→看多'+legA+'/看空'+legB,cls:'r'};
    }
    if(mVar){
        var term=mVar[3];
        legA=term+' '+mVar[1];
        legB=term+' '+mVar[2];
        if(up)return{txt:'走扩→看空'+legA+'/看多'+legB,cls:'b'};
        return{txt:'收窄→看多'+legA+'/看空'+legB,cls:'r'};
    }
    if(up)return{txt:'收益率上行→看空'+nm,cls:'b'};
    return{txt:'收益率下行→看多'+nm,cls:'r'};
}
function renderUpcoming(){
    var m=parseInt(document.getElementById('cur-month').value);
    var td=parseInt(document.getElementById('cur-td').value);
    var targets=[];
    var daysInMonth=[31,28,31,30,31,30,31,31,30,31,30,31];
    for(var i=1;i<=5;i++){
        var nm=m,nt=td+i;
        var dim=daysInMonth[nm-1];
        if(nt>dim){nt=nt-dim;nm=nm+1;if(nm>12)nm=1;}
        var key=(nm<10?'0'+nm:''+nm)+'-'+(nt<10?'0'+nt:''+nt);
        targets.push(key);
    }
    var hits=DATA.events.filter(function(e){return targets.indexOf(e.date)>=0&&e.probability>=0.7;});
    var agg={};
    hits.forEach(function(e){
        var k=e.series+'|'+e.direction;
        if(!agg[k])agg[k]={series:e.series,direction:e.direction,days:0,totalProb:0,totalChg:0,dates:[]};
        agg[k].days++;
        agg[k].totalProb+=e.probability;
        agg[k].totalChg+=e.avg_change;
        agg[k].dates.push(e.date);
    });
    var results=Object.values(agg).filter(function(a){return a.days>=2||(a.days===1&&a.totalProb>=0.85);});
    results.sort(function(a,b){return b.days-a.days||(b.totalProb/b.days)-(a.totalProb/a.days);});
    var box=document.getElementById('upcoming-events');
    if(results.length===0){
        box.innerHTML='<div class="judge-line"><span class="muted">未来 5 日暂无持续性高概率机会</span></div>';
        return;
    }
    var top=results.slice(0,3).map(function(a){var j=judgeBullBear(a.series,a.direction);return '<span class="'+(j.cls==='b'?'is-bear':'is-bull')+'">'+formatName(a.series)+' '+j.txt+'</span>';}).join('；');
    var html='<div class="judge-line"><b>本周研判</b>'+top+'</div>';
    html+='<table class="up-tbl"><thead><tr><th>品种</th><th>方向</th><th>多空研判</th><th>触发</th><th>概率</th><th>累计</th></tr></thead><tbody>';
    results.forEach(function(a){
        var dc=a.direction==='下行'?'down':'up';
        var avgP=(a.totalProb/a.days*100).toFixed(0);
        var strength=a.days>=4?'强':a.days>=3?'中':'';
        var j=judgeBullBear(a.series,a.direction);
        html+='<tr><td class="name">'+formatName(a.series)+'</td>';
        html+='<td><span class="dir '+dc+'">'+a.direction+'</span></td>';
        html+='<td class="'+(j.cls==='b'?'is-bear':'is-bull')+'">'+j.txt+'</td>';
        html+='<td class="num">'+a.days+'/5'+(strength?' <span class="strength">'+strength+'</span>':'')+'</td>';
        html+='<td class="num">'+avgP+'%</td>';
        html+='<td class="num">'+sgn(a.totalChg,1)+'<span class="unit">bp</span></td></tr>';
    });
    html+='</tbody></table>';
    box.innerHTML=html;
}
let sortKey='probability',sortAsc=false;
function sortEvents(key){
    if(sortKey===key){sortAsc=!sortAsc;}else{sortKey=key;sortAsc=(key==='date');}
    document.querySelectorAll('[id^="sort-"]').forEach(function(el){el.textContent='';});
    var arrow=sortAsc?'▲':'▼';
    var el=document.getElementById('sort-'+key);
    if(el)el.textContent=arrow;
    renderEvents();
}

function renderEvents(){
    var evts=filterEvents();
    evts.sort(function(a,b){
        var va,vb;
        if(sortKey==='date'){va=a.date;vb=b.date;}
        else if(sortKey==='direction'){va=a.direction;vb=b.direction;}
        else{va=a[sortKey];vb=b[sortKey];}
        if(va<vb)return sortAsc?-1:1;
        if(va>vb)return sortAsc?1:-1;
        return 0;
    });
    var summary=document.getElementById('events-summary');
    var downCount=evts.filter(e=>e.direction==='下行').length;
    var upCount=evts.filter(e=>e.direction==='上行').length;
    summary.innerHTML='筛选结果 <strong>'+evts.length+'</strong> 个高概率事件，下行 '+downCount+' 个，上行 '+upCount+' 个；点击任意行查看各年走势';
    var tbody=document.getElementById('events-body');
    tbody.innerHTML=evts.slice(0,300).map(function(e){
        var dc=e.direction==='下行'?'down':'up';

            '<td>'+formatName(e.series)+'</td>'+

            '<td class="prob"><span class="pv">'+pct+'%</span><span class="pbar"><i class="'+dc+'" style="width:'+pct+'%"></i></span></td>'+
            '<td class="num'+(e.avg_change<0?' down':e.avg_change>0?' up':'')+'">'+sgn(e.avg_change,1)+'<span class="unit">bp</span></td>'+
            '<td class="num'+(e.median_change<0?' down':e.median_change>0?' up':'')+'">'+sgn(e.median_change,1)+'<span class="unit">bp</span></td>'+

    }).join('');
}

function drawTrendChart(series,mdKey){
    var base=series.replace('_chg10','');
    var yd=DATA.yields_by_year[base]||DATA.spreads_by_year[base];
    if(!yd)return;
    /* 以所选日为基准：各年取离该日最近的交易日为 0 点，画前后各 20 个交易日的累计变化（bp）。
       收益率序列单位为 %（×100 转 bp），利差序列本身就是 bp。 */
    var isYld=!!DATA.yields_by_year[base];
    var scale=isYld?100:1;
    var tp=mdKey.split('-'), tM=parseInt(tp[0]), tD=parseInt(tp[1]);
    var allYrs=Object.keys(yd).sort();
    var y0=parseInt(allYrs[0]), y1=parseInt(allYrs[allYrs.length-1]);
    var violetAt=function(t){t=Math.max(0,Math.min(1,t));
        var a=[201,193,206],b=[74,62,82];
        return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';};
    // 拼成跨年全序列，便于 1 月/12 月的窗口越过年初年末
    var full=[];
    allYrs.forEach(function(yr){
        yd[yr].forEach(function(p){
            var md=p[0].split('-');
            full.push({d:yr+'-'+p[0],y:parseInt(yr),
                t:Date.UTC(parseInt(yr),parseInt(md[0])-1,parseInt(md[1])),v:p[1]});
        });
    });
    var X=[];
    for(var o=-20;o<=20;o++)X.push(String(o));
    var curYear=String(new Date().getFullYear());
    var tSeries=[],legendYrs=[],datesByYear={};
    allYrs.forEach(function(yr){
        var yi=parseInt(yr);
        var start=-1,end=-1;
        for(var i=0;i<full.length;i++){if(full[i].y===yi){if(start<0)start=i;end=i;}}
        if(start<0)return;
        // 当年内离目标月日最近的交易日；等距时取较早的（与原统计的 ffill 口径一致）
        var target=Date.UTC(yi,tM-1,tD);
        var bi=start,best=Math.abs(full[start].t-target);
        for(i=start+1;i<=end;i++){
            var dist=Math.abs(full[i].t-target);
            if(dist<best){best=dist;bi=i;}
        }
        // 该年数据离目标日太远（如数据从这个月才开始、或当年数据尚未到该月）则不画，
        // 否则会把年中/年末的缺口误当成基准日
        if(best>10*86400000)return;
        var vals=new Array(X.length).fill(null),drows={},has=false;
        for(var k=Math.max(0,bi-20);k<=Math.min(full.length-1,bi+20);k++){
            var off=k-bi;
            vals[off+20]=Math.round((full[k].v-full[bi].v)*scale*100)/100;
            drows[off+20]=full[k].d;
            has=true;
        }
        if(!has)return;
        legendYrs.push(yr);datesByYear[yr]=drows;
        tSeries.push({name:yr,type:'line',data:vals,connectNulls:false,
            lineStyle:{width:yr===curYear?2.5:1},
            itemStyle:{color:yr===curYear?'#42423A':violetAt((yi-y0)/Math.max(1,y1-y0))},
            symbol:'none',emphasis:{lineStyle:{width:2.5},focus:'series'}});
    });
    if(tSeries.length){
        tSeries[0].markLine={silent:true,symbol:'none',label:{show:false},
            lineStyle:{color:'#B9C5CF',width:0.5,type:'dashed'},
            data:[{yAxis:0},{xAxis:'0'}]};
    }
    var c2=echarts.init(document.getElementById('modal-trend'));
    c2.setOption({
        title:{text:formatName(base)+' 前后 20 个交易日变化（基准：'+mdLabel(mdKey)+'）',textStyle:{fontSize:13,fontWeight:600,color:'#42423A'}},
        tooltip:{trigger:'axis',axisPointer:{type:'line'},confine:true,
            formatter:function(ps){
                if(!ps||!ps.length)return '';
                var idx=ps[0].dataIndex,cells=[];
                ps.forEach(function(p){
                    if(p.value==null)return;
                    var dt=(datesByYear[p.seriesName]||{})[idx]||'';
                    var v=p.value;
                    var col=v>0?'#1E6B43':v<0?'#B8352C':'#66665B';
                    cells.push(dt+' <b style="color:'+col+'">'+(v>0?'+':'')+v.toFixed(2)+'bp</b>');
                });
                // 双列表格：20 年也压在 10 行内，且不受 tooltip 默认 nowrap 影响
                var html='<table style="font-size:11px;line-height:1.65;border-collapse:collapse">';
                for(var i=0;i<cells.length;i+=2){
                    html+='<tr><td style="padding-right:16px;white-space:nowrap">'+cells[i]+'</td><td style="white-space:nowrap">'+(cells[i+1]||'')+'</td></tr>';
                }
                return html+'</table>';
            }},
        legend:{data:legendYrs.slice().reverse(),type:'scroll',orient:'vertical',right:4,top:28,
            pageButtonPosition:'start',itemWidth:14,itemHeight:8,itemGap:6,textStyle:{fontSize:10}},
        xAxis:{type:'category',data:X,boundaryGap:false,
            // 函数间隔：固定每 5 个标签显示一次（-20、-15…基准…+20），避免轴自适应挑出 -9/+2 这类怪标签
            axisLabel:{interval:function(i){return i%5===0;},fontSize:11,
                formatter:function(v){var n=parseInt(v);return n===0?'基准':(n>0?'+'+n:String(n));}}},
        yAxis:{type:'value',name:'bp',scale:true},
        series:tSeries,grid:{left:55,right:90,top:35,bottom:28}
    },true);   // notMerge：换曲线/换年份集合时不合并旧系列
}

function renderCalendar(){
    if(!window.echarts){ whenEcharts(function(){ renderCalendar(); }); return; }
    var series=document.getElementById('calendar-series').value;
    var month=parseInt(document.getElementById('calendar-month').value);
    var h=DATA.heatmap[series];if(!h)return;
    var chart=echarts.init(document.getElementById('calendar-chart'));
    var ms=month<10?'0'+month:''+month;
    var days=[],avgs=[],probs=[],keys=[];
    for(var t=1;t<=31;t++){
        var mdKey=ms+'-'+(t<10?'0'+t:''+t);
        if(h[mdKey]){
            days.push(mdLabel(mdKey));
            avgs.push(h[mdKey].a);
            probs.push(h[mdKey].d>h[mdKey].u?-h[mdKey].d*100:h[mdKey].u*100);
            keys.push(mdKey);
        }
    }
    chart.setOption({
        title:{text:formatName(series)+' '+month+' 月各日平均变化（bp）',top:0,textStyle:{fontSize:13,fontWeight:600,color:'#42423A'}},
        tooltip:{trigger:'axis'},
        xAxis:{type:'category',data:days,axisLabel:{show:false},axisTick:{show:false}},
        yAxis:{type:'value'},
        series:[{type:'bar',barMaxWidth:22,data:avgs.map(function(v){return {value:v,itemStyle:{color:v<0?'#C23531':'#2E8B57'}};})}],
        grid:{left:48,right:20,top:36,bottom:10}
    });
    chart.on('click',function(p){
        var idx=p.dataIndex;
        if(keys[idx])showDetail(series,keys[idx]);
    });
    var chart2=echarts.init(document.getElementById('calendar-prob'));
    chart2.setOption({
        title:{text:'方向概率（%），负值为下行、正值为上行',top:4,textStyle:{fontSize:13,fontWeight:600,color:'#42423A'}},
        tooltip:{trigger:'axis',formatter:function(p){
            var v=p[0].value;
            return p[0].name+'　'+(v<0?'下行 '+(0-v).toFixed(0)+'%':'上行 '+v.toFixed(0)+'%');
        }},
        xAxis:{type:'category',data:days,axisLabel:{rotate:45,fontSize:13}},
        yAxis:{type:'value',min:-100,max:100,interval:50},
        series:[{type:'line',data:probs,lineStyle:{color:'#749AB2',width:2},itemStyle:{color:'#749AB2'},symbol:'circle',symbolSize:6,
            markLine:{silent:true,symbol:'none',label:{show:false},lineStyle:{color:'#C6D6E5',type:'solid',width:0.5},data:[{yAxis:0}]}}],
        grid:{left:48,right:20,top:40,bottom:62}
    });
    chart2.on('click',function(p){
        var idx=p.dataIndex;
        if(keys[idx])showDetail(series,keys[idx]);
    });
}

// Init
(function(){
    var tdSel=document.getElementById('cur-td');
    for(var i=1;i<=31;i++){var o=document.createElement('option');o.value=i;o.textContent=i;tdSel.appendChild(o);}
    var now=new Date();
    document.getElementById('cur-month').value=now.getMonth()+1;
    tdSel.value=now.getDate();
    renderUpcoming();
    var allS=Object.keys(DATA.heatmap).sort();
    ['heatmap-series','calendar-series'].forEach(function(id){
        var sel=document.getElementById(id);
        allS.forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=formatName(s);sel.appendChild(o);});
        sel.value='10Y国债_chg10';
    });
    document.querySelectorAll('#cat-btns .btn').forEach(function(b){b.addEventListener('click',function(){
        document.querySelectorAll('#cat-btns .btn').forEach(function(x){x.classList.remove('active');});
        b.classList.add('active');curCat=b.dataset.cat;curSeriesFilter='all';updateSeriesDropdown();renderEvents();
    });});
    document.querySelectorAll('#month-btns .btn').forEach(function(b){b.addEventListener('click',function(){
        document.querySelectorAll('#month-btns .btn').forEach(function(x){x.classList.remove('active');});
        b.classList.add('active');curMonth=parseInt(b.dataset.month);renderEvents();
    });});
    document.getElementById('prob-threshold').addEventListener('change',function(e){curProb=parseFloat(e.target.value);renderEvents();});
    ['dir-all','dir-down','dir-up'].forEach(function(id){
        document.getElementById(id).addEventListener('click',function(){
            ['dir-all','dir-down','dir-up'].forEach(function(x){document.getElementById(x).classList.remove('active');});
            document.getElementById(id).classList.add('active');
            curDir=id.replace('dir-','');renderEvents();
        });
    });
    document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){
        document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
        t.classList.add('active');
        ['events','heatmap','calendar'].forEach(function(p){document.getElementById('panel-'+p).classList.add('hidden');});
        document.getElementById('panel-'+t.dataset.tab).classList.remove('hidden');
        if(t.dataset.tab==='heatmap')renderHeatmap();
        if(t.dataset.tab==='calendar')renderCalendar();
    });});
    document.getElementById('heatmap-series').addEventListener('change',renderHeatmap);
    document.getElementById('calendar-series').addEventListener('change',renderCalendar);
    document.getElementById('calendar-month').addEventListener('change',renderCalendar);
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
    document.getElementById('modal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal();});
    updateSeriesDropdown();
    renderEvents();
    // 首屏渲染完成后再拉各年走势序列（约 1MB，不阻塞首屏）；点开详情时若还没到就等它
    setTimeout(function(){ensureSeries();},600);
})();
