<th style="width:75px;cursor:pointer" onclick="sortEvents('probability')">概率 <span id="sort-probability"></span></th><th style="width:75px;cursor:pointer" onclick="sortEvents('avg_change')">平均变化 <span id="sort-avg_change"></span></th><th style="width:70px;cursor:pointer" onclick="sortEvents('median_change')">中位数 <span id="sort-median_change"></span></th><th style="width:45px;cursor:pointer" onclick="sortEvents('n_years')">样本 <span id="sort-n_years"></span></th>

<script>

// 动态更新数据范围显示
(function(){
  var m=DATA.metadata||{};
  var dr=m.date_range||['',''];
  var nc=m.curves?m.curves.length:0;
  var ns=m.spread_names?m.spread_names.length:0;
  var el=document.getElementById('data-info');
  if(el)el.textContent='数据范围：'+dr[0]+' ~ '+dr[1]+' | 滚动10个交易日变化(bp) | '+nc+'条收益率曲线 + '+ns+'组利差 | 点击事件可查看各年详情';
})();

function formatName(s){return s.replace(/_chg10/g,'').replace(/_/g,' ')}
function mdLabel(key){
    if(DATA.md_key_to_label && DATA.md_key_to_label[key]) return DATA.md_key_to_label[key];
    var parts=key.split('-');
    if(parts.length===2) return parseInt(parts[0])+'月'+parseInt(parts[1])+'日';
    return key;
}
function classifyEvent(s){
    if(s.includes('5-2')||s.includes('10-5')||s.includes('10-2')||s.includes('30-10'))return 'term';
    if(s.includes('国开-国债')||s.includes('中票-国开')||s.includes('中票-二债')||s.includes('二债-国开')||false)return 'variety';
    if(s.includes('AA-AAA'))return 'credit';
    return 'yield';
}

let curCat='all',curMonth=0,curProb=0.7,curDir='all',curSeriesFilter='all';

function filterEvents(){
    return DATA.events.filter(e=>{
        if(e.probability<curProb)return false;
        if(curMonth>0){
            var m=parseInt(e.date.split('-')[0]);
            if(m!==curMonth)return false;
        }
        if(curCat!=='all'&&classifyEvent(e.series)!==curCat)return false;
        if(curSeriesFilter!=='all'&&e.series!==curSeriesFilter)return false;
        if(curDir==='down'&&e.direction!=='下行')return false;
        if(curDir==='up'&&e.direction!=='上行')return false;
        return true;
    }).sort((a,b)=>b.probability-a.probability);
}
function updateSeriesDropdown(){
    var sel=document.getElementById('series-filter');
    var seriesSet=new Set();
    DATA.events.forEach(function(e){
        if(curCat==='all'||classifyEvent(e.series)===curCat) seriesSet.add(e.series);
    });
    var sorted=Array.from(seriesSet).sort();
    sel.innerHTML='<option value="all">品种/利差 ▼</option>';
    sorted.forEach(function(s){
        var o=document.createElement('option');o.value=s;o.textContent=formatName(s);sel.appendChild(o);
    });
    if(curSeriesFilter!=='all'&&!seriesSet.has(curSeriesFilter)){curSeriesFilter='all';}
    sel.value=curSeriesFilter;
}

function judgeBullBear(series,direction){
    var nm=formatName(series);
    var s=series.replace(/_chg10/g,'');
    var up=(direction==='上行');
    var legA='',legB='';
    var mTerm=s.match(/^(\d+)-(\d+)(国债|国开)$/);
    var mVar=s.match(/^(.+?)-(.+?)(\d+Y)$/);
    if(mTerm){
        legA=mTerm[1]+'Y'+mTerm[3];
        legB=mTerm[2]+'Y'+mTerm[3];
        if(up)return{txt:'走扩(陡峭化)→看空'+legA+'/看多'+legB,cls:'b'};
        return{txt:'收窄(平坦化)→看多'+legA+'/看空'+legB,cls:'r'};
    }
    if(mVar){
        var term=mVar[3];
        legA=term+' '+mVar[1];
        legB=term+' '+mVar[2];
        if(up)return{txt:'走扩→看空'+legA+'/看多'+legB,cls:'b'};
        return{txt:'收窄→看多'+legA+'/看空'+legB,cls:'r'};
    }
    if(up)return{txt:'收益率上行→看空'+nm,cls:'b'};
    return{txt:'收益率下行→看多'+nm,cls:'r'};
}
function renderUpcoming(){
    var m=parseInt(document.getElementById('cur-month').value);
    var td=parseInt(document.getElementById('cur-td').value);
    var targets=[];
    var daysInMonth=[31,28,31,30,31,30,31,31,30,31,30,31];
    for(var i=1;i<=5;i++){
        var nm=m,nt=td+i;
        var dim=daysInMonth[nm-1];
        if(nt>dim){nt=nt-dim;nm=nm+1;if(nm>12)nm=1;}
        var key=(nm<10?'0'+nm:''+nm)+'-'+(nt<10?'0'+nt:''+nt);
        targets.push(key);
    }
    var hits=DATA.events.filter(function(e){return targets.indexOf(e.date)>=0&&e.probability>=0.7;});
    var agg={};
    hits.forEach(function(e){
        var k=e.series+'|'+e.direction;
        if(!agg[k])agg[k]={series:e.series,direction:e.direction,days:0,totalProb:0,totalChg:0,dates:[]};
        agg[k].days++;
        agg[k].totalProb+=e.probability;
        agg[k].totalChg+=e.avg_change;
        agg[k].dates.push(e.date);
    });
    var results=Object.values(agg).filter(function(a){return a.days>=2||(a.days===1&&a.totalProb>=0.85);});
    results.sort(function(a,b){return b.days-a.days||(b.totalProb/b.days)-(a.totalProb/a.days);});
    var box=document.getElementById('upcoming-events');
    if(results.length===0){
        box.innerHTML='<span style="color:#999">未来5日暂无持续性高概率机会</span>';
        return;
    }
    var top=results.slice(0,3).map(function(a){var j=judgeBullBear(a.series,a.direction);return '<span style="color:'+(j.cls==='b'?'#b71c1c':'#1b5e20')+';font-weight:700">'+formatName(a.series)+' '+j.txt+'</span>';}).join('；');
    var html='<div style="position:sticky;top:0;background:#fffde7;padding:6px 9px;border-bottom:2px solid #ffd54f;font-size:12px;line-height:1.6;z-index:2"><b>📌 本周研判：</b>'+top+'</div>';
    html+='<table style="width:100%;border-collapse:collapse;font-size:12px">';
    html+='<tr style="background:#fff3e0;position:sticky;top:32px;z-index:1"><th style="padding:5px 8px;text-align:left">品种</th><th style="padding:5px 8px">方向</th><th style="padding:5px 8px;text-align:left">多空研判</th><th style="padding:5px 8px">触发</th><th style="padding:5px 8px">概率</th><th style="padding:5px 8px">累计</th></tr>';
    results.forEach(function(a){
        var dc=a.direction==='下行'?'color:#b71c1c':'color:#1b5e20';
        var avgP=(a.totalProb/a.days*100).toFixed(0);
        var cumChg=a.totalChg.toFixed(1);
        var strength=a.days>=4?'🔥🔥':a.days>=3?'🔥':'';
        var j=judgeBullBear(a.series,a.direction);
        var jc=j.cls==='b'?'color:#b71c1c':'color:#1b5e20';
        html+='<tr style="border-bottom:1px solid #f0f0f0"><td style="padding:4px 8px;font-weight:600;white-space:nowrap">'+formatName(a.series)+'</td>';
        html+='<td style="padding:4px 8px;text-align:center;'+dc+';font-weight:700">'+a.direction+'</td>';
        html+='<td style="padding:4px 8px;font-size:11px;'+jc+';font-weight:600">'+j.txt+'</td>';
        html+='<td style="padding:4px 8px;text-align:center;font-weight:700;white-space:nowrap">'+a.days+'/5 '+strength+'</td>';
        html+='<td style="padding:4px 8px;text-align:center">'+avgP+'%</td>';
        html+='<td style="padding:4px 8px;text-align:center;'+dc+';white-space:nowrap">'+(a.totalChg>0?'+':'')+cumChg+'bp</td></tr>';
    });
    html+='</table>';
    box.innerHTML=html;
}
let sortKey='probability',sortAsc=false;
function sortEvents(key){
    if(sortKey===key){sortAsc=!sortAsc;}else{sortKey=key;sortAsc=(key==='date');}
    document.querySelectorAll('[id^="sort-"]').forEach(function(el){el.textContent='';});
    var arrow=sortAsc?'▲':'▼';
    var el=document.getElementById('sort-'+key);
    if(el)el.textContent=arrow;
    renderEvents();
}

function renderEvents(){
    var evts=filterEvents();
    evts.sort(function(a,b){
        var va,vb;
        if(sortKey==='date'){va=a.date;vb=b.date;}
        else if(sortKey==='direction'){va=a.direction;vb=b.direction;}
        else{va=a[sortKey];vb=b[sortKey];}
        if(va<vb)return sortAsc?-1:1;
        if(va>vb)return sortAsc?1:-1;
        return 0;
    });
    var summary=document.getElementById('events-summary');
    var downCount=evts.filter(e=>e.direction==='下行').length;
    var upCount=evts.filter(e=>e.direction==='上行').length;
    summary.innerHTML='筛选结果: <strong>'+evts.length+'</strong> 个高概率事件 (下行'+downCount+'个, 上行'+upCount+'个) | 点击任意行查看各年度详细走势';
    var tbody=document.getElementById('events-body');
    tbody.innerHTML=evts.slice(0,300).map(function(e){
        var dc=e.direction==='下行'?'down':'up';
        var bc=e.direction==='下行'?'down-bar':'up-bar';
        var pw=Math.round(e.probability*55);
        return '<tr onclick="showDetail(\''+e.series+'\',\''+e.date+'\')">'+
            '<td><strong>'+mdLabel(e.date)+'</strong></td>'+
            '<td>'+formatName(e.series)+'</td>'+
            '<td class="'+dc+'">'+e.direction+'</td>'+
            '<td><span class="prob-bar '+bc+'" style="width:'+pw+'px"></span> '+(e.probability*100).toFixed(0)+'%</td>'+
            '<td class="'+dc+'">'+(e.avg_change>0?'+':'')+e.avg_change.toFixed(1)+'bp</td>'+
            '<td class="'+dc+'">'+(e.median_change>0?'+':'')+e.median_change.toFixed(1)+'bp</td>'+
            '<td>'+e.n_years+'</td></tr>';
    }).join('');
}

function showDetail(series,mdKey){
    document.getElementById('modal').classList.add('show');
    var h=DATA.heatmap[series];
    if(!h||!h[mdKey])return;
    var s=h[mdKey];
    document.getElementById('modal-title').textContent=formatName(series)+' | '+mdLabel(mdKey)+' 未来10日变化详情';
    document.getElementById('modal-stats').innerHTML=
        '<div class="stat-card"><div class="label">下行概率</div><div class="value" style="color:#b71c1c">'+(s.d*100).toFixed(0)+'%</div></div>'+
        '<div class="stat-card"><div class="label">上行概率</div><div class="value" style="color:#1b5e20">'+(s.u*100).toFixed(0)+'%</div></div>'+
        '<div class="stat-card"><div class="label">平均变化</div><div class="value">'+(s.a>0?'+':'')+s.a.toFixed(1)+'bp</div></div>'+
        '<div class="stat-card"><div class="label">样本年数</div><div class="value">'+s.n+'</div></div>';
    var yrs=Object.keys(s.y).sort();
    var vals=yrs.map(function(y){return s.y[y];});
    var c1=echarts.init(document.getElementById('modal-chart'));
    c1.setOption({
        title:{text:'各年度变化幅度(bp)',textStyle:{fontSize:13}},
        tooltip:{trigger:'axis',formatter:function(p){return p[0].name+'年: '+(p[0].value>0?'+':'')+p[0].value.toFixed(1)+'bp';}},
        xAxis:{type:'category',data:yrs},
        yAxis:{type:'value',name:'bp'},
        series:[{type:'bar',data:vals.map(function(v){return {value:v,itemStyle:{color:v<0?'#f44336':'#4caf50'}};}),
            label:{show:true,position:'top',fontSize:10,formatter:function(p){return (p.value>0?'+':'')+p.value.toFixed(1);}}}],
        grid:{left:55,right:15,top:35,bottom:25}
    });
    var base=series.replace('_chg10','');
    var yd=DATA.yields_by_year[base]||DATA.spreads_by_year[base];
    if(yd){
        var tMonth=parseInt(mdKey.split('-')[0]);
        var colors=['#1a237e','#e53935','#43a047','#fb8c00','#8e24aa','#00acc1','#6d4c41','#546e7a','#d81b60'];
        var allYrs=Object.keys(yd).sort();
        var allDatesSet=new Set();
        var yrPtsMap={};
        allYrs.forEach(function(yr){
            var pts=yd[yr].filter(function(p){
                var m=parseInt(p[0].split('-')[0]);
                return m===tMonth;
            });
            yrPtsMap[yr]={};
            pts.forEach(function(p){allDatesSet.add(p[0]);yrPtsMap[yr][p[0]]=p[1];});
        });
        var unifiedDates=Array.from(allDatesSet).sort();
        var curYear=String(new Date().getFullYear());
        var tSeries=[];
        var legendYrs=[]; // 仅本月实际有数据的年份才进入图例，避免空年份(如2018-07)残留
        allYrs.forEach(function(yr,i){
            // 该年在本月实际拥有数据的最后一个日期索引：线只画到这里，不向未来延伸
            var lastIdx=-1;
            for(var k=0;k<unifiedDates.length;k++){if(yrPtsMap[yr][unifiedDates[k]]!==undefined){lastIdx=k;}}
            if(lastIdx<0)return;
            var vals2=unifiedDates.map(function(d,k){
                if(k>lastIdx)return null; // 超出该年已有数据范围，不渲染（防止错位/延伸到未来）
                return yrPtsMap[yr][d]!==undefined?yrPtsMap[yr][d]:null;
            });
            legendYrs.push(yr);
            tSeries.push({name:yr,type:'line',data:vals2,connectNulls:true,
                lineStyle:{width:yr===curYear?3:1.2},itemStyle:{color:colors[i%colors.length]},
                symbol:'none',emphasis:{lineStyle:{width:3}}});
        });
        var c2=echarts.init(document.getElementById('modal-trend'));
        c2.setOption({
            title:{text:formatName(base)+' 各年'+tMonth+'月走势叠加',textStyle:{fontSize:13}},
            tooltip:{trigger:'axis'},legend:{data:legendYrs,type:'scroll',orient:'vertical',right:6,top:30,itemWidth:14,itemHeight:8,itemGap:7,textStyle:{fontSize:10}},
            xAxis:{type:'category',data:unifiedDates},
            yAxis:{type:'value',name:series.includes('chg10')?'%':'bp'},
            series:tSeries,grid:{left:55,right:78,top:35,bottom:25}
        });
    }
}

function closeModal(){document.getElementById('modal').classList.remove('show');}

function renderHeatmap(){
    var series=document.getElementById('heatmap-series').value;
    var h=DATA.heatmap[series];if(!h)return;
    var chart=echarts.init(document.getElementById('heatmap-chart'));
    var cData=[];
    Object.keys(h).forEach(function(mdKey){
        var parts=mdKey.split('-');
        if(parts.length!==2)return;
        var m=parseInt(parts[0])-1;
        var t=parseInt(parts[1])-1;
        var s2=h[mdKey];
        var val=s2.d>s2.u?-s2.d:s2.u;
        cData.push([t,m,val,mdKey]);
    });
    chart.setOption({
        tooltip:{formatter:function(p){
            var mdKey=cData[p.dataIndex]?cData[p.dataIndex][3]:'';
            var s2=h[mdKey];if(!s2)return '';
            return mdLabel(mdKey)+'<br/>下行概率:'+(s2.d*100).toFixed(0)+'%<br/>上行概率:'+(s2.u*100).toFixed(0)+'%<br/>平均:'+(s2.a>0?'+':'')+s2.a.toFixed(1)+'bp<br/>样本:'+s2.n+'年';
        }},
        xAxis:{type:'category',data:Array.from({length:31},function(_,i){return (i+1)+'日';}),name:'日期',splitArea:{show:true}},
        yAxis:{type:'category',data:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],splitArea:{show:true}},
        visualMap:{min:-1,max:1,calculable:true,orient:'horizontal',left:'center',bottom:0,
            inRange:{color:['#b71c1c','#ef9a9a','#ffffff','#a5d6a7','#1b5e20']},text:['上行','下行']},
        series:[{type:'heatmap',data:cData.map(function(d){return [d[0],d[1],d[2]];}),label:{show:false}}],
        grid:{left:50,right:15,top:10,bottom:60}
    });
    chart.on('click',function(p){
        if(p.data){
            var mdKey2=cData.find(function(d){return d[0]===p.data[0]&&d[1]===p.data[1];});
            if(mdKey2)showDetail(series,mdKey2[3]);
        }
    });
}

function renderCalendar(){
    var series=document.getElementById('calendar-series').value;
    var month=parseInt(document.getElementById('calendar-month').value);
    var h=DATA.heatmap[series];if(!h)return;
    var chart=echarts.init(document.getElementById('calendar-chart'));
    var ms=month<10?'0'+month:''+month;
    var days=[],avgs=[],probs=[],keys=[];
    for(var t=1;t<=31;t++){
        var mdKey=ms+'-'+(t<10?'0'+t:''+t);
        if(h[mdKey]){
            days.push(mdLabel(mdKey));
            avgs.push(h[mdKey].a);
            probs.push(h[mdKey].d>h[mdKey].u?-h[mdKey].d*100:h[mdKey].u*100);
            keys.push(mdKey);
        }
    }
    chart.setOption({
        title:{text:formatName(series)+' '+month+'月各日季节性',textStyle:{fontSize:13}},
        tooltip:{trigger:'axis'},
        legend:{data:['平均变化(bp)','方向概率(%)'],top:5,right:10},
        xAxis:{type:'category',data:days,axisLabel:{rotate:45,fontSize:10}},
        yAxis:[{type:'value',name:'bp'},{type:'value',name:'%',min:-100,max:100}],
        series:[
            {name:'平均变化(bp)',type:'bar',yAxisIndex:0,data:avgs.map(function(v){return {value:v,itemStyle:{color:v<0?'#f44336':'#4caf50'}};})},
            {name:'方向概率(%)',type:'line',yAxisIndex:1,data:probs,lineStyle:{color:'#1a237e',width:2},itemStyle:{color:'#1a237e'},symbol:'circle',symbolSize:4}
        ],
        grid:{left:55,right:55,top:45,bottom:50}
    });
    chart.on('click',function(p){
        var idx=p.dataIndex;
        if(keys[idx])showDetail(series,keys[idx]);
    });
}

// Init
(function(){
    var tdSel=document.getElementById('cur-td');
    for(var i=1;i<=31;i++){var o=document.createElement('option');o.value=i;o.textContent=i;tdSel.appendChild(o);}
    var now=new Date();
    document.getElementById('cur-month').value=now.getMonth()+1;
    tdSel.value=now.getDate();
    renderUpcoming();
    var allS=Object.keys(DATA.heatmap).sort();
    ['heatmap-series','calendar-series'].forEach(function(id){
        var sel=document.getElementById(id);
        allS.forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=formatName(s);sel.appendChild(o);});
        sel.value='10Y国债_chg10';
    });
    document.querySelectorAll('#cat-btns .btn').forEach(function(b){b.addEventListener('click',function(){
        document.querySelectorAll('#cat-btns .btn').forEach(function(x){x.classList.remove('active');});
        b.classList.add('active');curCat=b.dataset.cat;curSeriesFilter='all';updateSeriesDropdown();renderEvents();
    });});
    document.querySelectorAll('#month-btns .btn').forEach(function(b){b.addEventListener('click',function(){
        document.querySelectorAll('#month-btns .btn').forEach(function(x){x.classList.remove('active');});
        b.classList.add('active');curMonth=parseInt(b.dataset.month);renderEvents();
    });});
    document.getElementById('prob-threshold').addEventListener('change',function(e){curProb=parseFloat(e.target.value);renderEvents();});
    ['dir-all','dir-down','dir-up'].forEach(function(id){
        document.getElementById(id).addEventListener('click',function(){
            ['dir-all','dir-down','dir-up'].forEach(function(x){document.getElementById(x).classList.remove('active');});
            document.getElementById(id).classList.add('active');
            curDir=id.replace('dir-','');renderEvents();
        });
    });
    document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){
        document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
        t.classList.add('active');
        ['events','heatmap','calendar'].forEach(function(p){document.getElementById('panel-'+p).classList.add('hidden');});
        document.getElementById('panel-'+t.dataset.tab).classList.remove('hidden');
        if(t.dataset.tab==='heatmap')renderHeatmap();
        if(t.dataset.tab==='calendar')renderCalendar();
    });});
    document.getElementById('heatmap-series').addEventListener('change',renderHeatmap);
    document.getElementById('calendar-series').addEventListener('change',renderCalendar);
    document.getElementById('calendar-month').addEventListener('change',renderCalendar);
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
    document.getElementById('modal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal();});
    updateSeriesDropdown();
    renderEvents();
})();

</script>
