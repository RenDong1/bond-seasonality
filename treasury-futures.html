<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国债期货市场日报</title>
<style>
  /* ===== 与债市季节性复盘风格一致的浅色主题 ===== */
  :root {
    --red: #c62828; --green: #2e7d32; --blue: #1a237e;
    --gold: #e65100; --purple: #6a1b9a;
    --bg: #f5f7fa; --card-bg: #fff; --border: #e0e0e0;
    --text: #333; --muted: #666; --subtle: #999;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  /* 顶栏保持深色(与季节性复盘一致) */
  .top-nav{display:flex;justify-content:space-between;align-items:center;padding:10px 30px;background:#12141d;border-bottom:1px solid #1e2130;position:sticky;top:0;z-index:200}
  .top-nav .brand{font-size:15px;font-weight:700;color:#e8eaed;text-decoration:none}
  .top-nav .brand span{color:#42a5f5}
  .top-nav .nav-links{display:flex;gap:4px}
  .top-nav .nav-links a{padding:5px 14px;border-radius:5px;font-size:12px;color:#787b86;text-decoration:none;transition:all 0.2s}
  .top-nav .nav-links a:hover{color:#e8eaed;background:rgba(255,255,255,0.05)}
  .top-nav .nav-links a.active{color:#e8eaed;background:rgba(66,165,245,0.15)}
  .container{max-width:1400px;margin:0 auto;padding:20px}
  /* 页面标题(蓝色渐变, 与季节性复盘一致) */
  .header{background:linear-gradient(135deg,#1a237e 0%,#283593 100%);color:#fff;padding:20px 30px;border-radius:12px;margin-bottom:20px;text-align:center}
  .header h1{font-size:22px;font-weight:700;margin-bottom:4px}
  .header .date{font-size:12px;opacity:0.85;margin-top:4px}
  .header .status{display:inline-block;background:rgba(255,255,255,0.2);color:#c8e6c9;padding:2px 10px;border-radius:4px;font-size:11px;margin-left:10px}
  /* 白色卡片面板(统一) */
  .panel,.full-panel,.risk-panel{background:var(--card-bg);border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06);margin-bottom:20px}
  .full-panel h3,.risk-panel h3{font-size:15px;color:#222;margin-bottom:14px}
  .risk-panel h3{display:flex;align-items:center;gap:8px}
  /* 综合信号栏 */
  .signal-bar{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .signal-card{background:var(--card-bg);border:2px solid var(--border);border-radius:12px;padding:20px 24px;box-shadow:0 2px 8px rgba(0,0,0,0.06);transition:border-color 0.3s}
  .signal-card.bullish{border-color:#ef9a9a}
  .signal-card.neutral{border-color:#ffcc80}
  .signal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
  .signal-header .contract-name{font-size:16px;font-weight:700;color:#222}
  .signal-header .contract-code{font-size:11px;color:var(--muted);background:#f5f5f5;padding:2px 8px;border-radius:4px}
  .signal-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:8px;font-size:18px;font-weight:800;letter-spacing:2px}
  .signal-badge.long{background:#ffebee;color:var(--red)}
  .signal-badge.short{background:#e8f5e9;color:var(--green)}
  .signal-badge.neutral{background:#fff3e0;color:var(--gold)}
  .signal-badge .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .signal-badge.long .dot{background:var(--red);box-shadow:0 0 6px rgba(198,40,40,0.4)}
  .signal-badge.short .dot{background:var(--green);box-shadow:0 0 6px rgba(46,125,50,0.4)}
  .signal-badge.neutral .dot{background:var(--gold);box-shadow:0 0 6px rgba(230,81,0,0.4)}
  .signal-info{margin-top:10px;font-size:12px;color:var(--muted)}
  .signal-info strong{color:#222}
  .sig-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .sig-item{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:5px;background:#fafafa;font-size:11px}
  .sig-item .sig-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .sig-item .sig-dot.bull{background:var(--red)}
  .sig-item .sig-dot.bear{background:var(--green)}
  .sig-item .sig-dot.neut{background:#bbb}
  .sig-item .sig-name{color:var(--muted);flex:1}
  .sig-item .sig-val{font-weight:600;color:#222;font-variant-numeric:tabular-nums}
  /* 快速统计 */
  .quick-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .stat-card{background:var(--card-bg);border-radius:10px;padding:16px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
  .stat-card .label{font-size:11px;color:var(--muted);letter-spacing:0.5px}
  .stat-card .value{font-size:24px;font-weight:700;color:#222;margin:4px 0}
  .stat-card .change{font-size:12px}
  .stat-card .change.up{color:var(--red)}
  .stat-card .change.down{color:var(--green)}
  /* 合约面板 */
  .main-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
  .contract-panel{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
  .contract-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#fafafa}
  .contract-header h2{font-size:16px;color:#222}
  .contract-header .code{font-size:11px;color:var(--muted);background:#eee;padding:2px 10px;border-radius:4px}
  .contract-body{padding:16px 20px}
  .ohlc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-bottom:14px}
  .ohlc-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f5f5f5}
  .ohlc-item .k{font-size:12px;color:var(--muted)}
  .ohlc-item .v{font-size:14px;font-weight:600;color:#222}
  .ohlc-item .v.red{color:var(--red)}
  .ohlc-item .v.green{color:var(--green)}
  .mini-chart-wrap{width:100%;height:200px;margin:8px 0;position:relative;background:#fafafa;border-radius:8px}
  .mini-chart-wrap canvas{width:100%;height:100%}
  .section-title{font-size:12px;color:var(--muted);letter-spacing:1px;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid #eee}
  .ind-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ind-row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ind-row-5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .ind-card{background:#fafafa;border:1px solid #eee;border-radius:8px;padding:10px 12px}
  .ind-card .ind-label{font-size:10px;color:var(--muted)}
  .ind-card .ind-value{font-size:17px;font-weight:700;color:#222;margin:2px 0}
  .ind-card .ind-sub{font-size:10px;color:var(--subtle)}
  .ctd-box{background:#e8eaf6;border:1px solid #c5cae9;border-radius:8px;padding:12px 16px;margin-bottom:12px}
  .ctd-box .ctd-label{font-size:10px;color:var(--blue);margin-bottom:3px}
  .ctd-box .ctd-code{font-size:18px;font-weight:700;color:#222}
  /* 风险预警 */
  .risk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .risk-card{border-radius:8px;padding:14px 16px;border:1px solid #eee}
  .risk-card.warn{background:#fff8e1;border-color:#ffcc80}
  .risk-card.danger{background:#ffebee;border-color:#ef9a9a}
  .risk-card.safe{background:#e8f5e9;border-color:#a5d6a7}
  .risk-card .risk-label{font-size:10px;color:var(--muted);letter-spacing:0.5px;margin-bottom:4px}
  .risk-card .risk-value{font-size:20px;font-weight:700;color:#222}
  .risk-card .risk-sub{font-size:10px;color:var(--subtle);margin-top:2px}
  .risk-card.warn .risk-value{color:var(--gold)}
  .risk-card.danger .risk-value{color:var(--red)}
  .risk-card.safe .risk-value{color:var(--green)}
  /* 表格 */
  .trend-table{width:100%;border-collapse:collapse;font-size:12px}
  .trend-table th{text-align:right;color:var(--muted);font-weight:500;padding:6px 6px;border-bottom:2px solid #e0e0e0;font-size:10px;white-space:nowrap;background:#fafafa}
  .trend-table th:first-child{text-align:left}
  .trend-table td{text-align:right;padding:5px 6px;border-bottom:1px solid #f0f0f0;font-variant-numeric:tabular-nums}
  .trend-table td:first-child{text-align:left;color:var(--muted)}
  .trend-table tr:hover td{background:#f5f5f5}
  .trend-table .up{color:var(--red)} .trend-table .down{color:var(--green)}
  /* K线走势区块 + 日期区间选择器 */
  .kline-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .kline-header h3{font-size:15px;color:#222;margin-bottom:0}
  .range-selector{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .range-btn{padding:5px 14px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--muted);font-size:12px;cursor:pointer;transition:all 0.2s;font-family:inherit}
  .range-btn:hover{border-color:#42a5f5;color:var(--blue)}
  .range-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .custom-range{display:inline-flex;align-items:center;gap:6px}
  .custom-range input[type=date]{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;color:#333;font-family:inherit}
  .kline-item{margin-bottom:18px}
  .kline-item:last-child{margin-bottom:0}
  .kline-title{font-size:13px;font-weight:600;color:#222;margin-bottom:8px}
  .kline-title .code{font-size:10px;color:var(--muted);background:#eee;padding:2px 8px;border-radius:4px;margin-left:6px}
  .kline-chart-wrap{width:100%;position:relative;background:#fafafa;border-radius:8px;border:1px solid #eee}
  .kline-chart-wrap canvas{width:100%;display:block}
  .kline-events{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:11px}
  .kline-events .oi-evt{background:#fff;border:1px solid #eee;border-radius:6px;padding:2px 8px;white-space:nowrap}
  .kline-events .oi-evt.oi-up{color:#ff6d00;border-color:#ffd180}
  .kline-events .oi-evt.oi-down{color:#0091ea;border-color:#81d4fa}
  .kline-events .oi-evt-empty{color:var(--muted)}
  .kline-analysis{margin-top:10px;padding:10px 14px;background:#fffde7;border:1px solid #fff59d;border-radius:8px;font-size:12px;color:#555;line-height:1.75}
  .kline-analysis strong{color:#222}
  @media(max-width:900px){
    .main-grid{grid-template-columns:1fr}
    .signal-bar{grid-template-columns:1fr}
    .quick-stats{grid-template-columns:1fr 1fr}
    .sig-grid{grid-template-columns:1fr 1fr}
    .ind-row{grid-template-columns:1fr 1fr}
    .ind-row-4,.ind-row-5{grid-template-columns:1fr 1fr}
    .risk-grid{grid-template-columns:1fr 1fr}
  }
</style>
</head>

<div class="container">

<div class="main-grid" id="contractsGrid"></div>

<div class="full-panel">

</div>

</div><!-- container -->

// ====== TECHNICAL INDICATOR COMPUTATION ======
function SMA(arr, n) {
  return arr.map((_, i) => {
    if (i < n-1) return null;
    let sum = 0;
    for (let j = i-n+1; j <= i; j++) sum += arr[j];
    return sum / n;
  });
}

function EMA(arr, n) {
  const k = 2 / (n + 1);
  const result = new Array(arr.length).fill(null);
  let sum = 0;
  for (let i = 0; i < n; i++) sum += arr[i];
  result[n-1] = sum / n;
  for (let i = n; i < arr.length; i++) {
    result[i] = arr[i] * k + result[i-1] * (1 - k);
  }
  return result;
}

function computeMACD(closes, fast, slow, signal) {
  fast = fast || 12; slow = slow || 26; signal = signal || 9;
  const emaFast = EMA(closes, fast);
  const emaSlow = EMA(closes, slow);
  const diffs = emaFast.map((v, i) => (v != null && emaSlow[i] != null) ? v - emaSlow[i] : null);
  const dea = new Array(diffs.length).fill(null);
  // DEA = EMA(signal, DIFF)，从第一个有效 diff 起顺序递推（前 signal 个 diff 取均值作种子）
  const k = 2 / (signal + 1);
  let prev = null, sum = 0, cnt = 0;
  for (let i = 0; i < diffs.length; i++) {
    if (diffs[i] === null) continue;
    if (prev === null) {
      sum += diffs[i]; cnt++;
      if (cnt === signal) { prev = sum / signal; dea[i] = prev; }
    } else {
      prev = diffs[i] * k + prev * (1 - k);
      dea[i] = prev;
    }
  }
  const bar = diffs.map((v, i) => (v !== null && dea[i] !== null) ? 2 * (v - dea[i]) : null);
  return { diff: diffs, dea, bar };
}

function computeKDJ(highs, lows, closes, n) {
  n = n || 9;
  const k = new Array(closes.length).fill(null);
  const d = new Array(closes.length).fill(null);
  const j = new Array(closes.length).fill(null);
  for (let i = n-1; i < closes.length; i++) {
    const hh = Math.max(...highs.slice(i-n+1, i+1));
    const ll = Math.min(...lows.slice(i-n+1, i+1));
    const rsv = hh === ll ? 50 : ((closes[i] - ll) / (hh - ll)) * 100;
    const prevK = k[i-1] !== null ? k[i-1] : 50;
    const prevD = d[i-1] !== null ? d[i-1] : 50;
    k[i] = (2/3) * prevK + (1/3) * rsv;
    d[i] = (2/3) * prevD + (1/3) * k[i];
    j[i] = 3 * k[i] - 2 * d[i];
  }
  return { k, d, j };
}

function computeRSI(closes, n) {
  n = n || 6;
  const rsi = new Array(closes.length).fill(null);
  if (closes.length < n+1) return rsi;
  let avgGain = 0, avgLoss = 0;
  for (let i = 1; i <= n; i++) {
    const chg = closes[i] - closes[i-1];
    if (chg > 0) avgGain += chg; else avgLoss += Math.abs(chg);
  }
  avgGain /= n; avgLoss /= n;
  rsi[n] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  for (let i = n+1; i < closes.length; i++) {
    const chg = closes[i] - closes[i-1];
    const gain = chg > 0 ? chg : 0;
    const loss = chg < 0 ? Math.abs(chg) : 0;
    avgGain = (avgGain * (n-1) + gain) / n;
    avgLoss = (avgLoss * (n-1) + loss) / n;
    rsi[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  }
  return rsi;
}

function computeBOLL(closes, n, k) {
  n = n || 20; k = k || 2;
  const mid = SMA(closes, n);
  const upper = new Array(closes.length).fill(null);
  const lower = new Array(closes.length).fill(null);
  for (let i = n-1; i < closes.length; i++) {
    const slice = closes.slice(i-n+1, i+1);
    const avg = mid[i];
    const variance = slice.reduce((s, v) => s + (v-avg)*(v-avg), 0) / n;
    const std = Math.sqrt(variance);
    upper[i] = avg + k * std;
    lower[i] = avg - k * std;
  }
  return { mid, upper, lower };
}

function computeATR(highs, lows, closes, n) {
  n = n || 14;
  const tr = new Array(closes.length).fill(null);
  if (highs[0] != null && lows[0] != null) tr[0] = highs[0] - lows[0];
  for (let i = 1; i < closes.length; i++) {
    if (highs[i] == null || lows[i] == null) continue;
    tr[i] = Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1]));
  }
  const atr = new Array(closes.length).fill(null);
  const firstN = tr.slice(0, n).filter(v => v !== null);
  if (firstN.length > 0) atr[n-1] = firstN.reduce((s,v) => s+v, 0) / firstN.length;
  for (let i = n; i < closes.length; i++) {
    if (tr[i] != null && atr[i-1] != null) atr[i] = (atr[i-1] * (n-1) + tr[i]) / n;
    else atr[i] = atr[i-1];
  }
  return atr;
}

function computeOBV(closes, volumes) {
  const obv = new Array(closes.length).fill(0);
  for (let i = 1; i < closes.length; i++) {
    if (closes[i] > closes[i-1]) obv[i] = obv[i-1] + volumes[i];
    else if (closes[i] < closes[i-1]) obv[i] = obv[i-1] - volumes[i];
    else obv[i] = obv[i-1];
  }
  return obv;
}

// ====== 浙商量化择时指标体系 ======
// 参考文献: 浙商证券《交易性择时多空视角下每日一图更新》(2026.02.25)
//          《基于隔夜信息的双周期共振日内择时与"每日一图"体系更新》(2026.05.20)
// 核心: 趋势识别—波动过滤—风险预警 三层结构, 多信号交叉验证(至少2个子策略同向触发)

// ---- WMA (加权移动平均, HMA的构建块) ----
function WMA(arr, n) {
  const result = new Array(arr.length).fill(null);
  const denom = n * (n + 1) / 2;
  for (let i = n - 1; i < arr.length; i++) {
    let sum = 0;
    for (let j = 0; j < n; j++) sum += arr[i - j] * (n - j);
    result[i] = sum / denom;
  }
  return result;
}

// ---- HMA (Hull Moving Average, 浙商"低延时趋势"核心算法) ----
// HMA = WMA( sqrt(n), 2*WMA(n/2) - WMA(n) )
// 相比传统均线大幅降低滞后, 在趋势启动初期即可识别方向变化
function HMA(arr, period) {
  const half = Math.floor(period / 2);
  const sqrt = Math.floor(Math.sqrt(period));
  const wmaHalf = WMA(arr, half);
  const wmaFull = WMA(arr, period);
  const result = new Array(arr.length).fill(null);

  // 逐点计算: 对每个位置, 取目前已完成的 raw = 2*wmaHalf-wmaFull 序列, 再做 sqrt 期 WMA
  for (let i = 0; i < arr.length; i++) {
    if (wmaHalf[i] === null || wmaFull[i] === null) continue;
    const raw = 2 * wmaHalf[i] - wmaFull[i];
    // 收集到当前为止的所有 raw 值
    const rawSeries = [];
    for (let j = 0; j <= i; j++) {
      if (wmaHalf[j] !== null && wmaFull[j] !== null) {
        rawSeries.push(2 * wmaHalf[j] - wmaFull[j]);
      }
    }
    if (rawSeries.length >= sqrt) {
      const recentRaw = rawSeries.slice(-sqrt);
      let wsum = 0;
      const wdenom = sqrt * (sqrt + 1) / 2;
      for (let k = 0; k < sqrt; k++) wsum += recentRaw[k] * (k + 1);
      result[i] = wsum / wdenom;
    }
  }
  return result;
}

// ---- 滚动偏度 (Skewness) ----
// 浙商"阶矩择时"模块: 负偏度骤扩 → 恐慌性抛压积累 → 空头预警
function rollingSkewness(returns, window) {
  const result = new Array(returns.length).fill(null);
  for (let i = window - 1; i < returns.length; i++) {
    const slice = returns.slice(i - window + 1, i + 1);
    const n = slice.length, mean = slice.reduce((s, v) => s + v, 0) / n;
    const m2 = slice.reduce((s, v) => s + (v - mean) ** 2, 0) / n;
    const m3 = slice.reduce((s, v) => s + (v - mean) ** 3, 0) / n;
    result[i] = m2 > 1e-12 ? m3 / (m2 ** 1.5) : 0;
  }
  return result;
}

// ---- 滚动峰度 (Kurtosis) ----
function rollingKurtosis(returns, window) {
  const result = new Array(returns.length).fill(null);
  for (let i = window - 1; i < returns.length; i++) {
    const slice = returns.slice(i - window + 1, i + 1);
    const n = slice.length, mean = slice.reduce((s, v) => s + v, 0) / n;
    const m2 = slice.reduce((s, v) => s + (v - mean) ** 2, 0) / n;
    const m4 = slice.reduce((s, v) => s + (v - mean) ** 4, 0) / n;
    result[i] = m2 > 1e-12 ? m4 / (m2 ** 2) : 3;
  }
  return result;
}

// ---- TD Sequential 九转结构 (DeMark) ----
// 浙商"九转序列"模块: 连续9根K线收盘价高于/低于4根K线前的收盘价 → 动能衰竭 → 反转预警
// 返回: { count: 1-9 (当前连续计数), direction: 'up'|'down'|null, complete: boolean }
function tdSetup(highs, lows, closes) {
  const n = closes.length;
  const counts = new Array(n).fill(0);
  const dirs = new Array(n).fill(null);

  for (let i = 4; i < n; i++) {
    const up = closes[i] > closes[i - 4];
    const down = closes[i] < closes[i - 4];
    if (up) {
      dirs[i] = 'up';
      counts[i] = (dirs[i - 1] === 'up') ? Math.min(counts[i - 1] + 1, 9) : 1;
    } else if (down) {
      dirs[i] = 'down';
      counts[i] = (dirs[i - 1] === 'down') ? Math.min(counts[i - 1] + 1, 9) : 1;
    } else {
      counts[i] = 0;
    }
  }
  return { counts, dirs };
}

// ---- VPIN 近似 (订单流毒性代理指标) ----
// 浙商核心创新: VPIN = E[|V_B - V_S|] / (n*V), 衡量买卖失衡程度
// 日内需要tick数据做等量桶; 日频近似: 用(close-open)方向×成交量 估算买卖量
// 高VPIN → 流动性枯竭预警 → 极端下行风险
function vpinProxy(opens, highs, lows, closes, volumes, bucketDays) {
  const n = closes.length;
  const vpin = new Array(n).fill(null);
  const buyVol = new Array(n).fill(0);
  const sellVol = new Array(n).fill(0);

  // 日内成交量分解近似: 基于价格运行区间
  for (let i = 0; i < n; i++) {
    if (highs[i] === null || lows[i] === null || opens[i] === null) continue;
    const range = highs[i] - lows[i];
    if (range < 1e-8) { buyVol[i] = volumes[i] * 0.5; sellVol[i] = volumes[i] * 0.5; continue; }
    // 收盘在区间上部的比例 ≈ 买方占比
    const closePos = (closes[i] - lows[i]) / range;
    buyVol[i] = volumes[i] * closePos;
    sellVol[i] = volumes[i] * (1 - closePos);
  }

  for (let i = bucketDays - 1; i < n; i++) {
    let totalV = 0, imbalance = 0;
    for (let j = i - bucketDays + 1; j <= i; j++) {
      totalV += volumes[j];
      imbalance += Math.abs(buyVol[j] - sellVol[j]);
    }
    vpin[i] = totalV > 0 ? imbalance / totalV : 0;
  }
  return vpin;
}

// ---- 隔夜共振近似 (日频替代) ----
// 浙商5月报告核心创新: 对High/Low做局部回归, 斜率β衡量支撑vs阻力相对强度
// β>1: 支撑强于阻力(偏多); β<1: 阻力强于支撑(偏空); R²为质量惩罚项
function overnightResonance(highs, lows, window) {
  const n = highs.length;
  const slopes = new Array(n).fill(null);
  const r2s = new Array(n).fill(null);

  for (let i = window - 1; i < n; i++) {
    const x = [], y = [];
    for (let j = i - window + 1; j <= i; j++) {
      if (highs[j] === null || lows[j] === null) continue;
      x.push(lows[j]);
      y.push(highs[j]);
    }
    const m = x.length;
    if (m < 5) continue;
    const sumX = x.reduce((a, b) => a + b, 0);
    const sumY = y.reduce((a, b) => a + b, 0);
    const sumXY = x.reduce((a, b, k) => a + b * y[k], 0);
    const sumX2 = x.reduce((a, b) => a + b * b, 0);
    const sumY2 = y.reduce((a, b) => a + b * b, 0);
    const denom = m * sumX2 - sumX * sumX;
    if (Math.abs(denom) < 1e-10) continue;
    const beta = (m * sumXY - sumX * sumY) / denom;
    const alpha = (sumY - beta * sumX) / m;
    // R²
    const yMean = sumY / m;
    const ssRes = y.reduce((s, yi, k) => { const pred = alpha + beta * x[k]; return s + (yi - pred) ** 2; }, 0);
    const ssTot = y.reduce((s, yi) => s + (yi - yMean) ** 2, 0);
    const r2 = ssTot > 1e-12 ? 1 - ssRes / ssTot : 0;
    slopes[i] = beta;
    r2s[i] = r2;
  }
  return { slopes, r2s };
}

// ====== 浙商多空信号确定 (8维交叉验证) ======
function determineSignals(data) {
  const closes = data.map(d => d.c);
  const highs = data.map(d => d.h);
  const lows = data.map(d => d.l);
  const opens = data.map(d => d.o);
  const volumes = data.map(d => d.v);
  const oi = data.map(d => d.oi);
  const n = closes.length, last = n - 1;

  // 日收益率 (用于阶矩计算)
  const returns = closes.map((c, i) => i > 0 && c !== null && closes[i-1] !== null ? (c - closes[i-1]) / closes[i-1] : null);

  // 预计算所有指标
  const ma5 = SMA(closes, 5);
  const ma10 = SMA(closes, 10);
  const ma20 = SMA(closes, 20);
  const hma10 = HMA(closes, 10);
  const boll = computeBOLL(closes, 20, 2);
  const macd = computeMACD(closes);
  const kdj = computeKDJ(highs, lows, closes, 9);
  const rsi = computeRSI(closes, 6);
  const atr14 = computeATR(highs, lows, closes, 14);
  const obv = computeOBV(closes, volumes);
  const volMa5 = SMA(volumes, 5);
  const skew = rollingSkewness(returns, 20);
  const kurt = rollingKurtosis(returns, 20);
  const td = tdSetup(highs, lows, closes);
  const vpin = vpinProxy(opens, highs, lows, closes, volumes, 10);
  const hmaSlope = SMA(hma10.filter(v => v !== null), 3); // HMA的3期斜率近似

  const sigs = [];

  // 逻辑: 价格>MA(5)且突破ATR波动过滤 = 有效趋势; 无波动确认 = 中性
  if (ma5[last] !== null && closes[last] !== null && atr14[last] !== null) {
    const dev = (closes[last] - ma5[last]) / atr14[last];
    const bull = dev > 0.5;
    const bear = dev < -0.5;
    sigs.push({
      name: '单均线跟踪', bull, bear,
      val: '偏离' + dev.toFixed(1) + 'σ',
      detail: bull ? '有效站上均线' : (bear ? '有效跌破均线' : '均线附近震荡')
    });
  } else {
    sigs.push({ name: '单均线跟踪', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // ─── 2. 双均线跟踪 (浙商趋势确认模块) ───
  if (ma5[last] !== null && ma10[last] !== null && ma20[last] !== null) {

    const expanding = Math.abs(ma5[last] - ma10[last]) > Math.abs((ma5[last-5]||ma5[last]) - (ma10[last-5]||ma10[last]));
    sigs.push({
      name: '双均线交叉', bull: golden, bear: !golden,
      val: golden ? (expanding ? '金叉发散' : '金叉') : (expanding ? '死叉发散' : '死叉'),
      detail: `MA5 ${ma5[last].toFixed(3)} | MA10 ${ma10[last].toFixed(3)} | MA20 ${ma20[last].toFixed(3)}`
    });
  } else {
    sigs.push({ name: '双均线交叉', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // ─── 3. 低延时趋势 (浙商HMA, 趋势启动识别) ───
  // 逻辑: HMA方向+斜率 = 低延迟趋势判断; 相比传统MA, HMA在趋势初期更快响应
  if (hma10[last] !== null && hma10[last-1] !== null && hma10[last-3] !== null) {
    const hmaUp = hma10[last] > hma10[last-1];
    const accelerating = hma10[last] - hma10[last-1] > hma10[last-1] - hma10[last-3];
    const hmaAboveMA = ma20[last] !== null && hma10[last] > ma20[last];
    sigs.push({
      name: '低延时趋势', bull: hmaUp && hmaAboveMA, bear: !hmaUp && !hmaAboveMA,
      val: hmaUp ? (accelerating ? '加速上倾' : '缓慢上倾') : (accelerating ? '加速下倾' : '缓慢下倾'),
      detail: `HMA(10) ${hma10[last].toFixed(3)} | 延迟较MA低约40%`
    });
  } else {
    sigs.push({ name: '低延时趋势', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // ─── 4. 通道过滤 (浙商波动结构识别, BOLL布林带) ───
  // 逻辑: 突破上轨=强势, 跌破下轨=弱势, 中轨上方=偏多
  if (boll.mid[last] !== null && boll.upper[last] !== null && boll.lower[last] !== null) {
    const aboveUpper = closes[last] > boll.upper[last];
    const belowLower = closes[last] < boll.lower[last];
    const aboveMid = closes[last] > boll.mid[last];

    sigs.push({
      name: '通道过滤', bull: aboveUpper || (aboveMid && bandwidth < 0.002), bear: belowLower,
      val: aboveUpper ? '突破上轨' : (belowLower ? '跌破下轨' : (aboveMid ? '中轨上方' : '中轨下方')),
      detail: `上${boll.upper[last].toFixed(3)} 中${boll.mid[last].toFixed(3)} 下${boll.lower[last].toFixed(3)}`
    });
  } else {
    sigs.push({ name: '通道过滤', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // ─── 5. 阶矩择时 (浙商波动结构层, 高阶矩刻画) ───

  if (skew[last] !== null && kurt[last] !== null) {

    const highKurt = kurt[last] > 4.5; // 峰度>4.5=厚尾风险

    const lowKurt = kurt[last] < 3.5;
    sigs.push({
      name: '阶矩择时', bull: posSkew && !highKurt, bear: negSkew || highKurt,
      val: `偏度${skew[last].toFixed(2)} 峰度${kurt[last].toFixed(2)}`,
      detail: negSkew ? '⚠ 负偏+下行风险' : (highKurt ? '⚠ 厚尾+极端风险' : (posSkew ? '正偏+趋势健康' : '分布正常'))
    });
  } else {
    sigs.push({ name: '阶矩择时', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // ─── 6. 九转序列 (浙商动能衰竭识别, TD Sequential) ───
  // 逻辑: 上涨9转=多头衰竭, 下跌9转=空头衰竭
  const tdCount = td.counts[last];
  const tdDir = td.dirs[last];
  const tdComplete = tdCount >= 9;
  if (tdCount > 0 && tdDir) {
    sigs.push({
      name: '九转序列', bull: tdDir === 'down' && tdComplete, bear: tdDir === 'up' && tdComplete,
      val: `${tdDir === 'up' ? '上涨' : '下跌'}${tdCount}转`,
      detail: tdComplete ? (tdDir === 'up' ? '⚠ 上涨结构9: 多头衰竭预警' : '◆ 下跌结构9: 空头衰竭信号') : `计数中(${tdCount}/9)`
    });
  } else {
    sigs.push({ name: '九转序列', bull: false, bear: false, val: '未触发', detail: '未形成有效结构' });
  }

  // ─── 7. VPIN近似 (浙商微观流动性预警) ───
  // 逻辑: VPIN>0.3=知情交易概率高→流动性枯竭预警; VPIN<0.15=订单流健康
  if (vpin[last] !== null) {
    const highVpin = vpin[last] > 0.35;
    const midVpin = vpin[last] > 0.20;
    const lowVpin = vpin[last] < 0.12;
    sigs.push({
      name: 'VPIN流动性', bull: lowVpin, bear: highVpin || midVpin,
      val: (vpin[last] * 100).toFixed(1) + '%',
      detail: highVpin ? '⚠ 毒性订单流+流动性枯竭预警' : (midVpin ? '订单流轻微失衡' : (lowVpin ? '订单流健康' : '正常区间'))
    });
  } else {
    sigs.push({ name: 'VPIN流动性', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // ─── 8. 隔夜共振 (浙商价格结构因子, β斜率) ───
  const orData = overnightResonance(highs, lows, 20);
  if (orData.slopes[last] !== null && orData.r2s[last] !== null) {
    const beta = orData.slopes[last];
    const r2 = orData.r2s[last];
    const strongSignal = r2 > 0.7;
    const bull = beta > 1.02 && strongSignal;
    const bear = beta < 0.98 && strongSignal;
    sigs.push({
      name: '隔夜共振', bull, bear,
      val: `β=${beta.toFixed(3)} R²=${r2.toFixed(2)}`,
      detail: bull ? '支撑>阻力, 区间上倾' : (bear ? '阻力>支撑, 区间下倾' : (r2 < 0.5 ? '无序波动, 方向不明' : '区间均衡'))
    });
  } else {
    sigs.push({ name: '隔夜共振', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // ─── 综合信号: 浙商"至少2个信号共振"触发机制 ───
  const bullCount = sigs.filter(s => s.bull).length;
  const bearCount = sigs.filter(s => s.bear).length;
  const activeCount = sigs.filter(s => s.bull || s.bear).length;

  let signal, signalLabel, signalClass;
  if (bullCount >= 5) {
    signal = 'long'; signalLabel = '强势偏多'; signalClass = 'long';
  } else if (bearCount >= 5) {
    signal = 'short'; signalLabel = '强势偏空'; signalClass = 'short';
  } else if (bullCount >= 3 && bullCount > bearCount) {
    signal = 'long_weak'; signalLabel = '谨慎偏多'; signalClass = 'neutral';
  } else if (bearCount >= 3 && bearCount > bullCount) {
    signal = 'short_weak'; signalLabel = '谨慎偏空'; signalClass = 'neutral';
  } else if (bullCount >= 2) {
    signal = 'long_weak'; signalLabel = '弱偏多'; signalClass = 'neutral';
  } else if (bearCount >= 2) {
    signal = 'short_weak'; signalLabel = '弱偏空'; signalClass = 'neutral';
  } else {
    signal = 'neutral'; signalLabel = '震荡观望'; signalClass = 'neutral';
  }

  return {
    sigs, bullCount, bearCount, activeCount, signal, signalLabel, signalClass,
    ind: {
      ma5: ma5[last], ma10: ma10[last], ma20: ma20[last],
      hma10: hma10[last],
      bollMid: boll.mid[last], bollUpper: boll.upper[last], bollLower: boll.lower[last],
      macdDiff: macd.diff[last], kdjK: kdj.k[last], rsi: rsi[last],
      skew: skew[last], kurt: kurt[last],
      tdCount, tdDir, vpin: vpin[last],
      orBeta: orData.slopes[last], orR2: orData.r2s[last]
    }
  };
}

// ====== RISK ASSESSMENT (浙商三层风险预警: 微观流动性+波动结构+趋势衰竭) ======
function assessRisk(tSig, tlSig, tData, tlData) {
  const risks = [];
  const tI = tSig.ind, tlI = tlSig.ind;

  // ─── 1. TL KDJ超买 (传统超买超卖) ───
  if (tlI.kdjK !== null && tlI.kdjK > 80)
    risks.push({ cls:'danger', label:'⚠ TL超买', value:'KDJ '+tlI.kdjK.toFixed(0), sub:'三十年期KDJ>80超买区间，短期回调风险显著上升' });
  else if (tlI.kdjK !== null && tlI.kdjK > 70)
    risks.push({ cls:'warn', label:'TL偏强区间', value:'KDJ '+tlI.kdjK.toFixed(0), sub:'接近超买区间，关注是否继续上行' });

  // ─── 2. VPIN流动性预警 (浙商核心创新) ───
  if (tI.vpin !== null && tI.vpin > 0.35)
    risks.push({ cls:'danger', label:'⚠ T 毒性订单流', value:'VPIN '+(tI.vpin*100).toFixed(0)+'%', sub:'VPIN高值预警: 知情交易概率上升，流动性面临枯竭风险' });
  else if (tI.vpin !== null && tI.vpin > 0.25)
    risks.push({ cls:'warn', label:'T 订单流失衡', value:'VPIN '+(tI.vpin*100).toFixed(0)+'%', sub:'订单流买卖失衡加剧，关注微观流动性变化' });
  if (tlI.vpin !== null && tlI.vpin > 0.35)
    risks.push({ cls:'danger', label:'⚠ TL 毒性订单流', value:'VPIN '+(tlI.vpin*100).toFixed(0)+'%', sub:'三十年期VPIN极端值，警惕流动性断裂引发剧烈波动' });

  // ─── 3. 阶矩择时风险 (偏度+峰度) ───
  if (tI.skew !== null && tI.skew < -0.5 && tI.kurt !== null && tI.kurt > 4)
    risks.push({ cls:'danger', label:'⚠ T 负偏+厚尾', value:'偏度'+tI.skew.toFixed(1)+' 峰度'+tI.kurt.toFixed(1), sub:'收益分布负偏+高峰度=极端下行风险积聚' });
  else if (tI.skew !== null && tI.skew < -0.3)
    risks.push({ cls:'warn', label:'T 收益负偏', value:'偏度'+tI.skew.toFixed(2), sub:'近期收益分布左偏，下行风险大于上行' });
  if (tlI.skew !== null && tlI.skew < -0.5)
    risks.push({ cls:'danger', label:'⚠ TL 极端负偏', value:'偏度'+tlI.skew.toFixed(1), sub:'三十年期负偏严重，尾部风险显著' });

  // ─── 4. 九转序列预警 (TD Sequential) ───
  if (tI.tdCount >= 9 && tI.tdDir === 'up')
    risks.push({ cls:'danger', label:'⚠ T 上涨9转', value:'多头衰竭', sub:'TD九转上涨结构完成，多头动能衰竭，警惕反转' });
  else if (tI.tdCount >= 7 && tI.tdDir === 'up')
    risks.push({ cls:'warn', label:'T 上涨'+tI.tdCount+'转', value:'接近衰竭', sub:'TD上涨计数接近9，关注动能衰减' });
  if (tlI.tdCount >= 9 && tlI.tdDir === 'up')
    risks.push({ cls:'danger', label:'⚠ TL 上涨9转', value:'多头衰竭', sub:'三十年期TD九转完成，历史反转概率高' });
  else if (tlI.tdCount >= 9 && tlI.tdDir === 'down')
    risks.push({ cls:'safe', label:'TL 下跌9转', value:'空头衰竭', sub:'TD下跌结构完成，空头动能衰竭，反弹概率上升' });

  // ─── 5. 低延时趋势分歧 ───
  if (tI.hma10 !== null && tI.ma20 !== null) {
    const hmaAboveMA = tI.hma10 > tI.ma20;
    const priceAboveMA = tData[tData.length-1].c > tI.ma20;
    if (hmaAboveMA !== priceAboveMA)
      risks.push({ cls:'warn', label:'T HMA-价格分歧', value:'趋势信号不一', sub:'低延时趋势与价格均线方向背离，趋势可靠性下降' });
  }

  // ─── 6. 隔夜共振预警 ───
  if (tlI.orBeta !== null && tlI.orR2 !== null && tlI.orR2 > 0.7 && tlI.orBeta < 0.97)
    risks.push({ cls:'warn', label:'TL 区间下倾', value:'β='+tlI.orBeta.toFixed(2), sub:'三十年期价格区间阻力>支撑，微观结构偏弱' });

  // ─── 7. 量能+持仓 ───
  const tVol = tData.map(d=>d.v), tlVol = tlData.map(d=>d.v);
  const tVol5 = tVol.slice(-5).reduce((a,b)=>a+b,0)/5;
  const tVol10 = tVol.slice(-10,-5).length > 0 ? tVol.slice(-10,-5).reduce((a,b)=>a+b,0)/5 : tVol5;
  if (tVol10 > 0 && tVol5 < tVol10 * 0.8)
    risks.push({ cls:'warn', label:'T 量能萎缩', value:'连续缩量', sub:'近5日均量较前期下降>' + ((1-tVol5/tVol10)*100).toFixed(0) + '%，市场等待方向' });

  const tOi = tData.map(d=>d.oi), tlOi = tlData.map(d=>d.oi);
  if (tOi[tOi.length-1] < tOi[tOi.length-3])
    risks.push({ cls:'warn', label:'T 持仓下降', value:'OI ↓', sub:'持仓趋势性下降，多头信心不足' });
  if (tlOi[tlOi.length-1] < tlOi[tlOi.length-5])
    risks.push({ cls:'danger', label:'TL 持仓骤降', value:'OI ↓ '+(tlOi[tlOi.length-1]-tlOi[tlOi.length-5]).toLocaleString(), sub:'三十年期持仓从高峰显著回落，部分多头离场' });

  // ─── 8. T-TL信号分化 ───
  if (tSig.signal.includes('long') && tlSig.signal.includes('short'))
    risks.push({ cls:'warn', label:'T-TL分化', value:'方向背离', sub:'十年期偏多vs三十年期偏空，曲线结构变化' });

  // ─── 兜底: 正常信号 ───
  if (risks.length === 0) {
    risks.push({ cls:'safe', label:'综合风险可控', value:'✓ 无预警', sub:'所有维度监控正常，未触发显著风险信号' });
    risks.push({ cls:'safe', label:'T 低波环境', value:'波动率极低', sub:'十年期波动率处历史低位，大幅回撤概率低' });
  } else {
    risks.push({ cls:'safe', label:'T 低波环境', value:'波动率极低', sub:'十年期波动率处历史低位' });
  }

  while (risks.length < 4) risks.push({ cls:'safe', label:'系统监控正常', value:'✓', sub:'当前无其他显著风险信号' });
  return risks.slice(0, 8);
}

const tlSignal = determineSignals(tlData);

// ====== CHART DRAWING (ECharts 交互式日K线: 主图 MA/BOLL/Fib + MACD/RSI 副图 + 增仓标记 + 十字光标) ======
let klineCharts = {};

// 斐波那契回撤位（区间最高/最低为摆动区间，0 / 23.6 / 38.2 / 50 / 61.8 / 78.6 / 100%）
function computeFib(data) {
  const valid = data.filter(d => d.h != null && d.l != null);
  if (valid.length < 2) return null;
  const hi = Math.max(...valid.map(d => d.h));
  const lo = Math.min(...valid.map(d => d.l));
  const range = hi - lo;
  if (range <= 0) return null;
  const last = valid[valid.length - 1].c;
  const up = last >= (hi + lo) / 2;   // 现价在区间上半部 → 上涨回撤，自低点向上；反之向下
  const base = up ? lo : hi;
  const ratios = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
  const levels = ratios.map(r => base + (up ? 1 : -1) * range * r);
  const labels = ratios.map(r => (r === 0 || r === 0.5 || r === 1) ? (r * 100) + '%' : (r * 100).toFixed(1) + '%');
  return { hi, lo, up, levels, labels };
}

function buildKlineOption(data) {
  const closes = data.map(d => d.c);
  const highs = data.map(d => d.h);
  const lows = data.map(d => d.l);
  const dates = data.map(d => d.date);
  const ma5 = SMA(closes, 5);
  const ma10 = SMA(closes, 10);
  const ma20 = SMA(closes, 20);
  const boll = computeBOLL(closes, 20, 2);
  const macd = computeMACD(closes);
  const rsi6 = computeRSI(closes, 6);
  const rsi12 = computeRSI(closes, 12);
  const UP = '#c62828', DOWN = '#2e7d32';
  const maxV = Math.max(...data.map(d => d.v), 1);

  // 增仓/减仓标记（▲大幅增仓 / ▼大幅减仓，独立 legend 项可开关）
  const oiScatter = [];
  for (let i = 1; i < data.length; i++) {
    const d0 = data[i-1], d1 = data[i];
    if (d0.oi == null || d1.oi == null) continue;
    const delta = d1.oi - d0.oi;
    if (delta >= OI_SURGE_THRESHOLD)
      oiScatter.push({ value: [d1.date, d1.h], delta: delta, symbol: 'triangle', symbolRotate: 0, symbolSize: 10, symbolOffset: [0, -10], itemStyle: { color: '#ff6d00' } });
    else if (delta <= -OI_SURGE_THRESHOLD)
      oiScatter.push({ value: [d1.date, d1.l], delta: delta, symbol: 'triangle', symbolRotate: 180, symbolSize: 10, symbolOffset: [0, 10], itemStyle: { color: '#0091ea' } });
  }

  // 斐波那契 markLine（挂在主图）
  const fib = computeFib(data);
  const fibLines = fib ? fib.labels.map((lbl, k) => ({
    yAxis: fib.levels[k],
    label: { formatter: 'Fib ' + lbl, position: 'insideEndTop', color: '#e65100', fontSize: 10 },
    lineStyle: { type: 'dashed', color: '#e65100', opacity: 0.45, width: 1 }
  })) : [];

  const tooltipFormatter = function (params) {
    const p = Array.isArray(params) ? params : [params];
    const idx = p[0] && p[0].dataIndex;
    const d = data[idx];
    if (!d) return '';
    const up = d.c >= d.o;
    const cc = up ? UP : DOWN;
    const oiDelta = idx > 0 && d.oi != null && data[idx-1].oi != null ? d.oi - data[idx-1].oi : null;
    const chg = idx > 0 ? ((d.c - data[idx-1].c) / data[idx-1].c * 100) : 0;
    const row = (k, v, style) => `<tr><td style="color:#888;padding-right:10px">${k}</td><td style="text-align:right;${style||''}">${v}</td></tr>`;
    let html = `<div style="font-weight:700;margin-bottom:4px">${d.date}</div><table style="font-size:11px;line-height:1.7">`;
    html += row('开盘', d.o.toFixed(3));
    html += row('收盘', d.c.toFixed(3), `color:${cc};font-weight:600`);
    html += row('最高', d.h.toFixed(3));
    html += row('最低', d.l.toFixed(3));
    html += row('涨跌', (chg >= 0 ? '+' : '') + chg.toFixed(3) + '%', `color:${chg >= 0 ? UP : DOWN}`);
    html += row('成交量', d.v.toLocaleString() + ' 手');
    html += row('持仓', (d.oi != null ? d.oi.toLocaleString() : '—') + ' 手');
    if (oiDelta != null) html += row('增仓', (oiDelta >= 0 ? '+' : '') + oiDelta.toLocaleString() + ' 手', `color:${oiDelta >= 0 ? UP : DOWN}`);
    if (ma5[idx] != null) html += row('MA5/10/20', `${ma5[idx].toFixed(3)} / ${ma10[idx].toFixed(3)} / ${ma20[idx].toFixed(3)}`);
    if (boll.upper[idx] != null) html += row('BOLL', `上${boll.upper[idx].toFixed(3)} 中${boll.mid[idx].toFixed(3)} 下${boll.lower[idx].toFixed(3)}`);
    if (macd.diff[idx] != null) html += row('MACD', `DIFF ${macd.diff[idx].toFixed(3)} / DEA ${macd.dea[idx] != null ? macd.dea[idx].toFixed(3) : '—'}`);
    if (rsi6[idx] != null) html += row('RSI(6/12)', `${rsi6[idx].toFixed(1)} / ${rsi12[idx].toFixed(1)}`);
    html += '</table>';
    return html;
  };

  return {
    animation: false,
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'axis',
      transitionDuration: 0,
      axisPointer: { type: 'cross', animation: false, crossStyle: { color: '#bbb' }, label: { backgroundColor: '#333', color: '#fff' } },
      backgroundColor: 'rgba(255,255,255,0.97)',
      borderColor: '#e0e0e0',
      textStyle: { color: '#333' },
      formatter: tooltipFormatter
    },
    axisPointer: { link: [{ xAxisIndex: 'all' }] },

// ====== 盘面分析文本（基于本地自算指标自动生成） ======
function generateAnalysis(data, name) {
  const n = data.length;
  if (n < 20) return '';
  const closes = data.map(d => d.c);
  const highs = data.map(d => d.h);
  const lows = data.map(d => d.l);
  const last = n - 1;
  const ma5 = SMA(closes, 5)[last];
  const ma20 = SMA(closes, 20)[last];
  const boll = computeBOLL(closes, 20, 2);
  const macd = computeMACD(closes);
  const rsi = computeRSI(closes, 6)[last];
  const chg = (closes[last] - closes[last-1]) / closes[last-1] * 100;
  const oiDelta = (data[last].oi != null && data[last-1].oi != null) ? data[last].oi - data[last-1].oi : null;

  const parts = [];
  if (closes[last] > ma5 && ma5 > ma20) parts.push('价格站上MA5且MA5>MA20，短期趋势偏强');
  else if (closes[last] < ma5 && ma5 < ma20) parts.push('价格跌破MA5且MA5<MA20，短期趋势偏弱');
  else parts.push('价格围绕均线震荡，方向暂不明朗');
  if (closes[last] > boll.upper[last]) parts.push('突破布林上轨，短线超买或存回落压力');
  else if (closes[last] < boll.lower[last]) parts.push('跌破布林下轨，短线超卖或迎技术性反弹');
  else if (closes[last] > boll.mid[last]) parts.push('运行于布林中轨上方，多头占优');
  else parts.push('运行于布林中轨下方，空头占优');
  if (macd.diff[last] != null && macd.dea[last] != null) {
    if (macd.diff[last] > macd.dea[last] && macd.diff[last] > 0) parts.push('MACD金叉且零轴上方，动能偏多');
    else if (macd.diff[last] < macd.dea[last] && macd.diff[last] < 0) parts.push('MACD死叉且零轴下方，动能偏空');
    else parts.push('MACD动能柱收敛，多空胶着');
  }
  if (rsi != null) {
    if (rsi > 70) parts.push('RSI(6)=' + rsi.toFixed(0) + ' 进入超买区');
    else if (rsi < 30) parts.push('RSI(6)=' + rsi.toFixed(0) + ' 进入超卖区');
    else parts.push('RSI(6)=' + rsi.toFixed(0) + ' 处中性区间');
  }
  if (oiDelta != null && oiDelta >= OI_SURGE_THRESHOLD) parts.push('当日大幅增仓' + fmtWan(oiDelta) + '，多头资金主动进场');
  else if (oiDelta != null && oiDelta <= -OI_SURGE_THRESHOLD) parts.push('当日大幅减仓' + fmtWan(oiDelta) + '，注意多头离场');
  else if (oiDelta != null) parts.push('持仓' + (oiDelta >= 0 ? '小幅增加' : '小幅减少') + fmtWan(Math.abs(oiDelta)));
  parts.push('当日收盘' + (chg >= 0 ? '上涨' : '下跌') + Math.abs(chg).toFixed(3) + '%');

  return '<strong>' + name + '</strong>：' + parts.join('；') + '。';
}

function renderAnalysis(elId, data, name) {
  const el = document.getElementById(elId);
  if (el) el.innerHTML = generateAnalysis(data, name);
}

// 日期标签格式化：跨年显示 YYYY-MM，年内显示 MM-DD
function fmtDate(dateStr, spanDays) {
  if (!dateStr) return '';
  if (dateStr.length < 8) return dateStr;  // 旧格式 MM-DD 原样
  return spanDays > 365 ? dateStr.slice(0, 7) : dateStr.slice(5);
}

// ====== K线日期区间选择 ======
const RANGE_DAYS = { '5y': 365 * 5, '3y': 365 * 3, '1y': 365, '6m': 182 };
const OI_SURGE_THRESHOLD = 15000; // 持仓变动信号: 单日增仓≥1.5万手=大幅增仓, ≤-1.5万手=大幅减仓
let chartRange = '1y';
let customStart = null, customEnd = null;

function subtractDays(dateStr, days) {
  const parts = dateStr.split('-').map(Number);
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  dt.setDate(dt.getDate() - days);
  const yy = dt.getFullYear();
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  return yy + '-' + mm + '-' + dd;
}

function filterByRange(data) {
  if (!data || data.length === 0) return data;
  if (chartRange === 'custom') {
    const s = customStart || data[0].date;
    const e = customEnd || data[data.length - 1].date;
    return data.filter(d => d.date >= s && d.date <= e);
  }
  const cutoff = subtractDays(data[data.length - 1].date, RANGE_DAYS[chartRange] || 365);
  return data.filter(d => d.date >= cutoff);
}

function fmtWan(v) { return (Math.abs(v) / 10000).toFixed(2) + '万'; }

// 计算区间内的大幅增仓/减仓事件（相邻两日持仓量差）
function oiEvents(data) {
  const ev = [];
  for (let i = 1; i < data.length; i++) {
    const d0 = data[i-1], d1 = data[i];
    if (d0.oi == null || d1.oi == null) continue;
    const delta = d1.oi - d0.oi;
    if (delta >= OI_SURGE_THRESHOLD) ev.push({ date: d1.date, delta, up: true });
    else if (delta <= -OI_SURGE_THRESHOLD) ev.push({ date: d1.date, delta, up: false });
  }
  return ev;
}

function renderOiEvents(elId, data) {
  const el = document.getElementById(elId);
  if (!el) return;
  const evs = oiEvents(data).slice(-10).reverse(); // 最近10条
  if (!evs.length) { el.innerHTML = '<span class="oi-evt-empty">当前区间无大幅增仓/减仓</span>'; return; }
  el.innerHTML = evs.map(e =>
    `<span class="oi-evt ${e.up?'oi-up':'oi-down'}">${e.up?'增':'减'} ${fmtWan(e.delta)} · ${e.date}</span>`).join('');
}

function renderKlines() {
  if (typeof echarts === 'undefined') return;
  const tRange = filterByRange(tData);
  const tlRange = filterByRange(tlData);
  const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
  if (!klineCharts.klineT) klineCharts.klineT = echarts.init(document.getElementById('klineT'), null, { devicePixelRatio: dpr });
  if (!klineCharts.klineTL) klineCharts.klineTL = echarts.init(document.getElementById('klineTL'), null, { devicePixelRatio: dpr });
  const tOpt = buildKlineOption(tRange);
  const tlOpt = buildKlineOption(tlRange);
  // 保留当前图例选中状态：调整时间区间时不重置已开/关的指标
  const tSel = (klineCharts.klineT.getOption().legend || [{}])[0].selected;
  const tlSel = (klineCharts.klineTL.getOption().legend || [{}])[0].selected;
  if (tSel) tOpt.legend.selected = tSel;
  if (tlSel) tlOpt.legend.selected = tlSel;
  klineCharts.klineT.setOption(tOpt, true);
  klineCharts.klineTL.setOption(tlOpt, true);
  renderOiEvents('klineEventsT', tRange);
  renderOiEvents('klineEventsTL', tlRange);
  renderAnalysis('analysisT', tRange, '十年期国债期货');
  renderAnalysis('analysisTL', tlRange, '三十年期国债期货');
}

  const btns = document.querySelectorAll('.range-btn');
  btns.forEach(btn => {

      document.getElementById('customRange').style.display = (chartRange === 'custom') ? 'inline-flex' : 'none';
      renderKlines();

  document.getElementById('customStart').addEventListener('change', () => {
    customStart = document.getElementById('customStart').value || null;

  });
  document.getElementById('customEnd').addEventListener('change', () => {
    customEnd = document.getElementById('customEnd').value || null;
    renderKlines();
  });
}

          <div class="ind-card"><div class="ind-label">VR 量比率</div><div class="ind-value">${ind.vr != null ? ind.vr : '—'}</div><div class="ind-sub">${ind.vr_sub || '—'}</div></div>
          <div class="ind-card"><div class="ind-label">DMA 均线差</div><div class="ind-value">${ind.dma != null ? ind.dma : '—'}</div><div class="ind-sub">${ind.dma_sub || '—'}</div></div>
          <div class="ind-card"><div class="ind-label">TRIX 三重平滑</div><div class="ind-value">${ind.trix != null ? ind.trix : '—'}</div><div class="ind-sub">${ind.trix_sub || '—'}</div></div>
          <div class="ind-card"><div class="ind-label">MTM 动量</div><div class="ind-value">${ind.mtm != null ? ind.mtm : '—'}</div><div class="ind-sub">${ind.mtm_sub || '—'}</div></div>
          <div class="ind-card"><div class="ind-label">MFI 资金流</div><div class="ind-value">${ind.mfi != null ? ind.mfi : '—'}</div><div class="ind-sub">${ind.mfi_sub || '—'}</div></div>
        </div>
        <div class="section-title">📐 期现关系</div>
        <div class="ctd-box"><div class="ctd-label">最便宜可交割债券 CTD</div><div class="ctd-code">${ind.ctd_bond || '—'}</div></div>
        <div class="ind-row">
          <div class="ind-card"><div class="ind-label">IRR 隐含回购利率</div><div class="ind-value">${ind.irr != null ? ind.irr.toFixed(2)+'%' : '—'}</div></div>
          <div class="ind-card"><div class="ind-label">净基差 BNOC</div><div class="ind-value">${ind.bnoc != null ? ind.bnoc.toFixed(4) : '—'}</div></div>
          <div class="ind-card"><div class="ind-label">期现价差</div><div class="ind-value">${ind.basis != null ? ind.basis : '—'}</div></div>
        </div>
        <div class="section-title">🏦 中信期货持仓</div>
        <div class="ind-row">
          <div class="ind-card"><div class="ind-label">多头持仓</div><div class="ind-value">${(ind.member_long||0).toLocaleString()}</div></div>
          <div class="ind-card"><div class="ind-label">空头持仓</div><div class="ind-value">${(ind.member_short||0).toLocaleString()}</div></div>
          <div class="ind-card"><div class="ind-label">净持仓</div><div class="ind-value" style="color:${netColor}">${memberNet>0?'+':''}${(memberNet||0).toLocaleString()} 手</div><div class="ind-sub">${netLabel}</div></div>
        </div>
      </div></div>`;
  }
  document.getElementById('contractsGrid').innerHTML =
    contractPanel('🔟', '十年期国债期货', 'TZL.CFE', tData, D.indicators_t) +
    contractPanel('🕐', '三十年期国债期货', 'TLZL2.CFE', tlData, D.indicators_tl);

  // Risk Grid
  document.getElementById('riskGrid').innerHTML = risks.map(r =>
    `<div class="risk-card ${r.cls}"><div class="risk-label">${r.label}</div><div class="risk-value">${r.value}</div><div class="risk-sub">${r.sub}</div></div>`).join('');

  // Trend Table
  const allDates = [...new Set([...tData.map(d=>d.date), ...tlData.map(d=>d.date)])].sort().slice(-10);
  let thtml = `<thead><tr><th>日期</th><th>T 开盘</th><th>T 最高</th><th>T 最低</th><th>T 收盘</th><th>T 涨跌%</th><th>T 成交</th><th>T 持仓</th><th>TL 开盘</th><th>TL 最高</th><th>TL 最低</th><th>TL 收盘</th><th>TL 涨跌%</th><th>TL 成交</th><th>TL 持仓</th></tr></thead><tbody>`;
  allDates.forEach(date => {
    const t = tData.find(d=>d.date===date)||{}, tl = tlData.find(d=>d.date===date)||{};
    const ti = tData.indexOf(t), tli = tlData.indexOf(tl);
    const pt = ti>0?tData[ti-1]:null, ptl = tli>0?tlData[tli-1]:null;
    const tc = pt&&t.c?((t.c-pt.c)/pt.c*100):null, tlc = ptl&&tl.c?((tl.c-ptl.c)/ptl.c*100):null;
    const isL = date===allDates[allDates.length-1];
    thtml += `<tr><td>${date}</td>
      <td>${t.o||'—'}</td><td>${t.h||'—'}</td><td>${t.l||'—'}</td><td${isL?' style="font-weight:700;color:#00897b"':''}>${t.c||'—'}</td>
      <td class="${tc>0?'up':tc<0?'down':''}">${tc!=null?tc.toFixed(4)+'%':'—'}</td>
      <td>${t.v?t.v.toLocaleString():'—'}</td><td>${t.oi?t.oi.toLocaleString():'—'}</td>
      <td>${tl.o||'—'}</td><td>${tl.h||'—'}</td><td>${tl.l||'—'}</td><td${isL?' style="font-weight:700;color:#7b1fa2"':''}>${tl.c||'—'}</td>
      <td class="${tlc>0?'up':tlc<0?'down':''}">${tlc!=null?tlc.toFixed(4)+'%':'—'}</td>
      <td>${tl.v?tl.v.toLocaleString():'—'}</td><td>${tl.oi?tl.oi.toLocaleString():'—'}</td></tr>`;
  });
  document.getElementById('trendTable').innerHTML = thtml + '</tbody>';

  // Draw K线图（按区间选择）
  if (tData.length) {
    document.getElementById('customStart').value = tData[0].date;
    document.getElementById('customEnd').value = tData[tData.length - 1].date;
  }
  setTimeout(() => {
    renderKlines();
    setupRangeSelector();
  }, 50);
}

window.addEventListener('DOMContentLoaded', renderAll);
window.addEventListener('resize', () => {
  Object.values(klineCharts).forEach(c => c && c.resize());
});
</script>
</body>
</html>
