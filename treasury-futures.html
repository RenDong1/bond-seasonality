// ====== TECHNICAL INDICATOR COMPUTATION ======
function SMA(arr, n) {
  return arr.map((_, i) => {
    if (i < n-1) return null;
    let sum = 0;
    for (let j = i-n+1; j <= i; j++) sum += arr[j];
    return sum / n;
  });
}

function EMA(arr, n) {
  const k = 2 / (n + 1);
  const result = new Array(arr.length).fill(null);
  let sum = 0;
  for (let i = 0; i < n; i++) sum += arr[i];
  result[n-1] = sum / n;
  for (let i = n; i < arr.length; i++) {
    result[i] = arr[i] * k + result[i-1] * (1 - k);
  }
  return result;
}

function computeMACD(closes, fast, slow, signal) {
  fast = fast || 12; slow = slow || 26; signal = signal || 9;
  const emaFast = EMA(closes, fast);
  const emaSlow = EMA(closes, slow);
  const diffs = emaFast.map((v, i) => (v != null && emaSlow[i] != null) ? v - emaSlow[i] : null);
  const valid = diffs.filter(v => v !== null);
  const deaVals = EMA(valid, signal);
  const dea = new Array(diffs.length).fill(null);
  let j = 0;
  for (let i = 0; i < diffs.length; i++) {
    if (diffs[i] !== null && j < deaVals.length && deaVals[j] !== null) { dea[i] = deaVals[j]; j++; }
  }
  const bar = diffs.map((v, i) => (v !== null && dea[i] !== null) ? 2 * (v - dea[i]) : null);
  return { diff: diffs, dea, bar };
}

function computeKDJ(highs, lows, closes, n) {
  n = n || 9;
  const k = new Array(closes.length).fill(null);
  const d = new Array(closes.length).fill(null);
  const j = new Array(closes.length).fill(null);
  for (let i = n-1; i < closes.length; i++) {
    const hh = Math.max(...highs.slice(i-n+1, i+1));
    const ll = Math.min(...lows.slice(i-n+1, i+1));
    const rsv = hh === ll ? 50 : ((closes[i] - ll) / (hh - ll)) * 100;
    const prevK = k[i-1] !== null ? k[i-1] : 50;
    const prevD = d[i-1] !== null ? d[i-1] : 50;
    k[i] = (2/3) * prevK + (1/3) * rsv;
    d[i] = (2/3) * prevD + (1/3) * k[i];
    j[i] = 3 * k[i] - 2 * d[i];
  }
  return { k, d, j };
}

function computeRSI(closes, n) {
  n = n || 6;
  const rsi = new Array(closes.length).fill(null);
  if (closes.length < n+1) return rsi;
  let avgGain = 0, avgLoss = 0;
  for (let i = 1; i <= n; i++) {
    const chg = closes[i] - closes[i-1];
    if (chg > 0) avgGain += chg; else avgLoss += Math.abs(chg);
  }
  avgGain /= n; avgLoss /= n;
  rsi[n] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  for (let i = n+1; i < closes.length; i++) {
    const chg = closes[i] - closes[i-1];
    const gain = chg > 0 ? chg : 0;
    const loss = chg < 0 ? Math.abs(chg) : 0;
    avgGain = (avgGain * (n-1) + gain) / n;
    avgLoss = (avgLoss * (n-1) + loss) / n;
    rsi[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  }
  return rsi;
}

function computeBOLL(closes, n, k) {
  n = n || 20; k = k || 2;
  const mid = SMA(closes, n);
  const upper = new Array(closes.length).fill(null);
  const lower = new Array(closes.length).fill(null);
  for (let i = n-1; i < closes.length; i++) {
    const slice = closes.slice(i-n+1, i+1);
    const avg = mid[i];
    const variance = slice.reduce((s, v) => s + (v-avg)*(v-avg), 0) / n;
    const std = Math.sqrt(variance);
    upper[i] = avg + k * std;
    lower[i] = avg - k * std;
  }
  return { mid, upper, lower };
}

function computeATR(highs, lows, closes, n) {
  n = n || 14;
  const tr = new Array(closes.length).fill(null);
  if (highs[0] != null && lows[0] != null) tr[0] = highs[0] - lows[0];
  for (let i = 1; i < closes.length; i++) {
    if (highs[i] == null || lows[i] == null) continue;
    tr[i] = Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1]));
  }
  const atr = new Array(closes.length).fill(null);
  const firstN = tr.slice(0, n).filter(v => v !== null);
  if (firstN.length > 0) atr[n-1] = firstN.reduce((s,v) => s+v, 0) / firstN.length;
  for (let i = n; i < closes.length; i++) {
    if (tr[i] != null && atr[i-1] != null) atr[i] = (atr[i-1] * (n-1) + tr[i]) / n;
    else atr[i] = atr[i-1];
  }
  return atr;
}

function computeOBV(closes, volumes) {
  const obv = new Array(closes.length).fill(0);
  for (let i = 1; i < closes.length; i++) {
    if (closes[i] > closes[i-1]) obv[i] = obv[i-1] + volumes[i];
    else if (closes[i] < closes[i-1]) obv[i] = obv[i-1] - volumes[i];
    else obv[i] = obv[i-1];
  }
  return obv;
}

// ====== SIGNAL DETERMINATION ======
function determineSignals(data) {
  const closes = data.map(d => d.c);
  const highs = data.map(d => d.h);
  const lows = data.map(d => d.l);
  const volumes = data.map(d => d.v);
  const oi = data.map(d => d.oi);
  const n = closes.length, last = n - 1;

  const ma5 = SMA(closes, 5);
  const ma10 = SMA(closes, 10);
  const boll = computeBOLL(closes);
  const macd = computeMACD(closes);
  const kdj = computeKDJ(highs, lows, closes, 9);
  const rsi = computeRSI(closes, 6);
  const obv = computeOBV(closes, volumes);
  const volMa5 = SMA(volumes, 5);

  const sigs = [];

  // 1. MA Trend
  if (ma5[last] !== null && closes[last] !== null) {
    const aboveMA5 = closes[last] > ma5[last];
    const aboveMA10 = ma10[last] !== null && closes[last] > ma10[last];
    sigs.push({ name: '均线趋势', bull: aboveMA5 && aboveMA10, bear: !aboveMA5 && !aboveMA10,
      val: 'C>' + (ma5[last]||0).toFixed(2), detail: aboveMA5 ? '价格在均线上方' : '价格在均线下方' });
  } else {
    sigs.push({ name: '均线趋势', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // 2. Dual MA
  if (ma5[last] !== null && ma10[last] !== null) {
    const golden = ma5[last] > ma10[last];
    sigs.push({ name: '双均线交叉', bull: golden, bear: !golden,
      val: golden ? '金叉' : '死叉', detail: `MA5 ${ma5[last].toFixed(2)} vs MA10 ${ma10[last].toFixed(2)}` });
  } else {
    sigs.push({ name: '双均线交叉', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // 3. BOLL
  if (boll.mid[last] !== null && closes[last] !== null) {
    const aboveMid = closes[last] > boll.mid[last];
    const nearUpper = boll.upper[last] !== null && closes[last] >= boll.upper[last] * 0.995;
    sigs.push({ name: '布林通道', bull: aboveMid && !nearUpper, bear: !aboveMid,
      val: aboveMid ? (nearUpper ? '触及上轨' : '偏强') : '偏弱',
      detail: `中轨 ${boll.mid[last].toFixed(2)}` });
  } else {
    sigs.push({ name: '布林通道', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // 4. MACD
  if (macd.diff[last] !== null) {
    const diffUp = macd.diff[last] > 0;
    const diffRising = macd.diff[last-1] !== null && macd.diff[last] > macd.diff[last-1];
    sigs.push({ name: 'MACD', bull: diffUp, bear: !diffUp,
      val: macd.diff[last].toFixed(3), detail: diffRising ? '动能增强' : (diffUp ? '动能减弱' : '空头主导') });
  } else {
    sigs.push({ name: 'MACD', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // 5. KDJ
  if (kdj.k[last] !== null) {
    const kv = kdj.k[last];
    sigs.push({ name: 'KDJ', bull: kv > 50 && kv <= 80, bear: kv < 50,
      val: kv.toFixed(1), detail: kv > 80 ? '⚠ 超买' : (kv < 20 ? '超卖' : (kv > 50 ? '偏强' : '偏弱')) });
  } else {
    sigs.push({ name: 'KDJ', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // 6. RSI
  if (rsi[last] !== null) {
    const rv = rsi[last];
    sigs.push({ name: 'RSI', bull: rv > 50, bear: rv <= 50,
      val: rv.toFixed(1), detail: rv > 70 ? '超买' : (rv > 50 ? '偏多' : (rv < 30 ? '超卖' : '偏空')) });
  } else {
    sigs.push({ name: 'RSI', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  // 7. Volume/Flow
  if (volMa5[last] !== null) {
    const volExpanding = volumes[last] > volMa5[last];
    const obvRising = obv[last-1] !== null && obv[last] > obv[last-1];
    const oiTrend = oi[last] !== null && oi[last-2] !== null && oi[last] > oi[last-2];
    const bullish = obvRising && oiTrend;
    sigs.push({ name: '量能资金流', bull: bullish, bear: !bullish && !obvRising,
      val: volExpanding ? '放量' : '缩量',
      detail: obvRising ? (oiTrend ? 'OBV↑ OI↑' : 'OBV↑') : (oiTrend ? 'OI↑' : '量能减弱') });
  } else {
    sigs.push({ name: '量能资金流', bull: false, bear: false, val: '—', detail: '数据不足' });
  }

  const bullCount = sigs.filter(s => s.bull).length;
  const bearCount = sigs.filter(s => s.bear).length;
  let signal, signalLabel, signalClass;
  if (bullCount >= 5) { signal = 'long'; signalLabel = '偏多'; signalClass = 'long'; }
  else if (bearCount >= 5) { signal = 'short'; signalLabel = '偏空'; signalClass = 'short'; }
  else if (bullCount >= 3) { signal = 'long_weak'; signalLabel = '谨慎偏多'; signalClass = 'neutral'; }
  else if (bearCount >= 3) { signal = 'short_weak'; signalLabel = '谨慎偏空'; signalClass = 'neutral'; }
  else { signal = 'neutral'; signalLabel = '震荡观望'; signalClass = 'neutral'; }

  return { sigs, bullCount, bearCount, signal, signalLabel, signalClass,
    ind: { ma5: ma5[last], ma10: ma10[last], bollMid: boll.mid[last], bollUpper: boll.upper[last], bollLower: boll.lower[last],
      macdDiff: macd.diff[last], kdjK: kdj.k[last], rsi: rsi[last] }
  };
}

// ====== RISK ASSESSMENT ======
function assessRisk(tSig, tlSig, tData, tlData) {
  const risks = [];
  if (tlSig.ind.kdjK !== null && tlSig.ind.kdjK > 80)
    risks.push({ cls:'warn', label:'TL超买预警', value:'KDJ '+tlSig.ind.kdjK.toFixed(0), sub:'三十年期KDJ处超买边缘，短期回调风险上升' });
  else if (tlSig.ind.kdjK !== null && tlSig.ind.kdjK > 70)
    risks.push({ cls:'warn', label:'TL偏强区间', value:'KDJ '+tlSig.ind.kdjK.toFixed(0), sub:'接近超买区间，关注是否继续上行' });

  const tVol = tData.map(d=>d.v), tlVol = tlData.map(d=>d.v);
  const tVol5 = tVol.slice(-5).reduce((a,b)=>a+b,0)/5, tVol10 = tVol.slice(-10,-5).reduce((a,b)=>a+b,0)/5;
  if (tVol10 > 0 && tVol5 < tVol10 * 0.8)
    risks.push({ cls:'warn', label:'T 量能萎缩', value:'连续缩量', sub:'近5日均量较前5日下降>' + ((1-tVol5/tVol10)*100).toFixed(0) + '%，等待方向' });

  const tOi = tData.map(d=>d.oi), tlOi = tlData.map(d=>d.oi);
  if (tOi[tOi.length-1] < tOi[tOi.length-3])
    risks.push({ cls:'warn', label:'T 持仓下降', value:'OI ↓', sub:'持仓量趋势性下降，多头信心不足' });
  if (tlOi[tlOi.length-1] < tlOi[tlOi.length-5])
    risks.push({ cls:'danger', label:'TL 持仓骤降', value:'OI ↓ '+(tlOi[tlOi.length-1]-tlOi[tlOi.length-5]).toLocaleString(), sub:'三十年期持仓从高峰回落，部分多头离场' });

  if (tSig.signal.includes('long') && tlSig.signal.includes('short'))
    risks.push({ cls:'warn', label:'T-TL信号分化', value:'方向不一', sub:'十年期与三十年期信号方向背离，风格切换可能' });

  risks.push({ cls:'safe', label:'T 低波环境', value:'波动率极低', sub:'十年期波动率低，降低大幅回撤风险' });
  risks.push({ cls:'warn', label:'TL 高弹品种', value:'波动率>25x T', sub:'三十年期波动率远高于十年期，需控制仓位' });

  while (risks.length < 4) risks.push({ cls:'safe', label:'系统监控正常', value:'✓', sub:'当前无其他显著风险信号' });
  return risks.slice(0, 8);
}

// ====== COMPUTE ALL ======
const tData = FUTURES_DATA.data_t;
const tlData = FUTURES_DATA.data_tl;
const tSignal = determineSignals(tData);
const tlSignal = determineSignals(tlData);
const risks = assessRisk(tSignal, tlSignal, tData, tlData);

// ====== CHART DRAWING ======
function drawChart(canvasId, data, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const W = rect.width, H = 180;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  const prices = data.map(d=>d.c).filter(p=>p);
  const vols = data.map(d=>d.v).filter(v=>v);
  const minP = Math.min(...prices) * 0.999, maxP = Math.max(...prices) * 1.001;
  const maxV = Math.max(...vols), n = data.length, pw = W / (n - 1);
  const volH = 40, volY = H - volH;
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  data.forEach((d,i) => {
    if (!d.v) return;
    const bw = Math.max(1, pw * 0.6), bh = (d.v / maxV) * volH;
    ctx.fillRect(i * pw - bw/2, volY + (volH - bh), bw, bh);
  });
  ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
  ctx.beginPath();
  let started = false, firstI = -1;
  data.forEach((d,i) => {
    if (!d.c) return;
    if (firstI < 0) firstI = i;
    const x = i * pw, y = volY * ((maxP - d.c) / (maxP - minP));
    started ? ctx.lineTo(x, y) : (ctx.moveTo(x, y), started = true);
  });
  ctx.stroke();
  if (firstI >= 0) {
    ctx.lineTo((data.filter(d=>d.c).length-1)*pw, volY);
    ctx.lineTo(firstI*pw, volY);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0,0,0,volY);
    grad.addColorStop(0, color+'30'); grad.addColorStop(1, color+'00');
    ctx.fillStyle = grad; ctx.fill();
  }
  const last = data.filter(d=>d.c).pop(), lastI = data.lastIndexOf(last);
  if (lastI >= 0) {
    ctx.fillStyle = color; ctx.beginPath();
    ctx.arc(lastI * pw, volY * ((maxP - last.c) / (maxP - minP)), 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#787b86'; ctx.font = '10px "Segoe UI","PingFang SC",sans-serif';
    ctx.fillText(maxP.toFixed(3), 4, 14);
    ctx.fillText(minP.toFixed(3), 4, volY - 4);
    ctx.fillText(last.c.toFixed(3), Math.min(lastI * pw + 6, W - 50), 14);
  }
}

  document.getElementById('contractsGrid').innerHTML =
    contractPanel('🔟', '十年期国债期货', 'TZL.CFE', tData, D.indicators_t, 'chartT', '#26a69a') +
    contractPanel('🕐', '三十年期国债期货', 'TLZL2.CFE', tlData, D.indicators_tl, 'chartTL', '#ab47bc');

  // Risk Grid
  document.getElementById('riskGrid').innerHTML = risks.map(r =>
    `<div class="risk-card ${r.cls}"><div class="risk-label">${r.label}</div><div class="risk-value">${r.value}</div><div class="risk-sub">${r.sub}</div></div>`).join('');

  // Trend Table
  const allDates = [...new Set([...tData.map(d=>d.date), ...tlData.map(d=>d.date)])].sort();
  let thtml = `<thead><tr><th>日期</th><th>T 开盘</th><th>T 最高</th><th>T 最低</th><th>T 收盘</th><th>T 涨跌%</th><th>T 成交</th><th>T 持仓</th><th>TL 开盘</th><th>TL 最高</th><th>TL 最低</th><th>TL 收盘</th><th>TL 涨跌%</th><th>TL 成交</th><th>TL 持仓</th></tr></thead><tbody>`;
  allDates.forEach(date => {
    const t = tData.find(d=>d.date===date)||{}, tl = tlData.find(d=>d.date===date)||{};
    const ti = tData.indexOf(t), tli = tlData.indexOf(tl);
    const pt = ti>0?tData[ti-1]:null, ptl = tli>0?tlData[tli-1]:null;
    const tc = pt&&t.c?((t.c-pt.c)/pt.c*100):null, tlc = ptl&&tl.c?((tl.c-ptl.c)/ptl.c*100):null;
    const isL = date===allDates[allDates.length-1];
    thtml += `<tr><td>${date}</td>
      <td>${t.o||'—'}</td><td>${t.h||'—'}</td><td>${t.l||'—'}</td><td${isL?' style="font-weight:700;color:#26a69a"':''}>${t.c||'—'}</td>
      <td class="${tc>0?'up':tc<0?'down':''}">${tc!=null?tc.toFixed(4)+'%':'—'}</td>
      <td>${t.v?t.v.toLocaleString():'—'}</td><td>${t.oi?t.oi.toLocaleString():'—'}</td>
      <td>${tl.o||'—'}</td><td>${tl.h||'—'}</td><td>${tl.l||'—'}</td><td${isL?' style="font-weight:700;color:#ab47bc"':''}>${tl.c||'—'}</td>
      <td class="${tlc>0?'up':tlc<0?'down':''}">${tlc!=null?tlc.toFixed(4)+'%':'—'}</td>
      <td>${tl.v?tl.v.toLocaleString():'—'}</td><td>${tl.oi?tl.oi.toLocaleString():'—'}</td></tr>`;
  });
  document.getElementById('trendTable').innerHTML = thtml + '</tbody>';

  // Market Observation
  document.getElementById('obsGrid').innerHTML = `
    <div><p style="color:var(--muted);margin-bottom:8px;">🔟 十年期 TZL.CFE</p><p style="color:var(--text);line-height:1.8;">${D.obs_t_html}</p></div>
    <div><p style="color:var(--muted);margin-bottom:8px;">🕐 三十年期 TLZL2.CFE</p><p style="color:var(--text);line-height:1.8;">${D.obs_tl_html}</p></div>`;

  // Draw charts
  setTimeout(() => {
    drawChart('chartT', tData, '#26a69a');
    drawChart('chartTL', tlData, '#ab47bc');
  }, 50);
}

window.addEventListener('DOMContentLoaded', renderAll);
window.addEventListener('resize', () => {
  drawChart('chartT', tData, '#26a69a');
  drawChart('chartTL', tlData, '#ab47bc');
});
</script>
</body>
</html>
